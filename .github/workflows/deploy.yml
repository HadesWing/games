name: Deploy games

# 门厅页 push、或游戏分支的「Signal games update」跑完，就重新发布；也可手动点运行。
# push 事件只读取被推送分支上的工作流文件，orphan 游戏分支必须自带信号工作流；
# 而且 github-pages 环境只允许默认分支部署，所以由这里的 workflow_run（运行在默认分支）接手。
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Signal games update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 取门厅页（main）
        uses: actions/checkout@v4
        with:
          ref: main
          path: src/main

      - name: 取小小地球（earth）
        uses: actions/checkout@v4
        with:
          ref: earth
          path: src/earth

      - name: 取小动物数独（kids-sudoku）
        uses: actions/checkout@v4
        with:
          ref: kids-sudoku
          path: src/kids-sudoku

      - name: 取视觉小侦探（visual-detective）
        uses: actions/checkout@v4
        with:
          ref: visual-detective
          path: src/visual-detective

      - name: 取拼音乐园（pinyin）
        uses: actions/checkout@v4
        with:
          ref: pinyin
          path: src/pinyin

      - name: 取猜数字（guess-number）
        uses: actions/checkout@v4
        with:
          ref: guess-number
          path: src/guess-number

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/earth/package-lock.json

      - name: 构建小小地球（单文件产物）
        working-directory: src/earth
        run: |
          npm ci
          npm run build

      - name: 组装站点
        run: |
          set -e
          mkdir -p _site/earth _site/kids-sudoku _site/visual-detective _site/pinyin _site/guess-number
          cp src/main/index.html _site/index.html
          touch _site/.nojekyll
          cp src/earth/dist/index.html _site/earth/index.html
          # pinyin 的 web/index.html 已内嵌 75 条真人录音，单文件直接拷贝即可
          cp src/pinyin/web/index.html _site/pinyin/index.html
          cp src/guess-number/index.html _site/guess-number/index.html

          # 数独分支早期版本是"earth 根目录 + kids-sudoku/ 子目录"，这里兼容两种布局
          if [ -f "src/kids-sudoku/kids-sudoku/小动物数独乐园.html" ]; then
            SUDOKU="src/kids-sudoku/kids-sudoku"
          else
            SUDOKU="src/kids-sudoku"
          fi
          cp "$SUDOKU/小动物数独乐园.html" _site/kids-sudoku/index.html
          if [ -d "$SUDOKU/assets" ]; then cp -r "$SUDOKU/assets" _site/kids-sudoku/assets; fi

          VD=$(find src/visual-detective -maxdepth 1 -name "*.html" | head -1)
          cp "$VD" _site/visual-detective/index.html

          echo "--- 站点内容 ---"
          find _site -type f -printf '%8k KB  %p\n' | sort -k3

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
