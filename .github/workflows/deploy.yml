name: Signal games update

# GitHub 的 push 事件只读取「被推送分支」上的工作流文件，而 github-pages 环境
# 只允许默认分支部署。所以本分支只负责发信号，真正的发布由 main 上的
# Deploy games 通过 workflow_run 完成（workflow_run 运行在默认分支，可正常部署）。
on:
  push:
    branches:
      - guess-number
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - run: echo "guess-number 有更新，等待 main 的 Deploy games 重新发布"
