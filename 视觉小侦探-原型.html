<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉小侦探 · 原型 v2</title>
<style>
  :root{
    --bg:#FBF6EE; --card:#FFFFFF; --ink:#3E3A33; --sub:#8A8377;
    --accent:#F59E0B; --ok:#34B37E; --bad:#E86A5E;
    --r:18px; --shadow:0 4px 14px rgba(62,58,51,.10);
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; overflow:auto; padding:24px;}
  .screen.active{display:flex;}
  h1{font-size:34px; margin:8px 0 4px;}
  .sub{color:var(--sub); font-size:15px; margin-bottom:18px;}
  .btn{
    border:none; cursor:pointer; border-radius:999px; font-family:inherit;
    background:var(--card); color:var(--ink); box-shadow:var(--shadow);
    padding:14px 26px; font-size:18px; transition:transform .08s;
  }
  .btn:active{transform:scale(.95);}
  .btn.primary{background:var(--accent); color:#fff; font-size:20px; padding:16px 34px;}
  .btn.small{font-size:14px; padding:8px 16px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  /* ---------- 首页 ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,220px,1fr); gap:20px; width:100%; max-width:980px;}
  .tile{
    background:var(--card); border-radius:var(--r); box-shadow:var(--shadow);
    padding:22px 18px; cursor:pointer; text-align:center; position:relative;
    transition:transform .1s; border:3px solid transparent;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile .ico{font-size:52px;}
  .tile .nm{font-size:21px; font-weight:700; margin:8px 0 2px;}
  .tile .ab{font-size:13px; color:var(--sub);}
  .tile .lv{
    position:absolute; top:10px; right:12px; background:var(--bg);
    border-radius:999px; font-size:13px; padding:3px 10px; color:var(--sub);
  }
  .tile.locked{opacity:.45; cursor:not-allowed;}
  .topbar{width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  /* ---------- 游戏 ---------- */
  #scr-game{padding:12px 24px;}
  .gamebar{width:100%; max-width:920px; display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .gamebar .title{font-size:22px; font-weight:700;}
  .gamebar .hint{color:var(--sub); font-size:14px; flex:1;}
  #game-body{width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center;}
  canvas.stage{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); cursor:crosshair;}
  .board{
    display:grid; gap:10px; background:var(--card); padding:22px;
    border-radius:var(--r); box-shadow:var(--shadow);
  }
  .cell{
    width:74px; height:74px; border-radius:14px; border:none; cursor:pointer;
    background:#F4EDE2; color:var(--ink); font-size:26px; font-weight:700;
    font-family:inherit; display:flex; align-items:center; justify-content:center;
    transition:background .12s, transform .1s;
  }
  .cell:hover{background:#EFE5D4;}
  .cell.done{background:var(--ok); color:#fff; cursor:default;}
  .cell.miss{background:var(--bad); color:#fff; animation:shake .25s;}
  .cell.reveal{background:#FFE9C7;}
  .cell.ghost{visibility:hidden;}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .bignum{
    font-size:44px; font-weight:800; color:var(--accent);
    background:var(--card); border-radius:var(--r); box-shadow:var(--shadow);
    padding:6px 34px; margin-bottom:12px;
  }
  .statline{font-size:16px; color:var(--sub); margin:4px 0;}
  /* ---------- 结算 ---------- */
  .panel{
    background:var(--card); border-radius:24px; box-shadow:var(--shadow);
    padding:34px 46px; text-align:center; margin-top:6vh; max-width:520px;
  }
  .verdict{font-size:22px; font-weight:700; color:var(--ink); margin:2px 0 0;}
  .stars{font-size:56px; letter-spacing:8px; margin:10px 0;}
  .stars span{display:inline-block;}
  .stars .off{opacity:.22;}
  .lines{margin:14px 0 22px;}
  .lines div{font-size:17px; padding:5px 0;}
  .rowbtns{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  /* ---------- 报告 / 设置 ---------- */
  .wrap{width:100%; max-width:900px;}
  .card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:20px 24px; margin-bottom:18px;}
  table{border-collapse:collapse; width:100%; font-size:14px;}
  td,th{padding:6px 8px; border-bottom:1px solid #F0E9DC; text-align:left;}
  th{color:var(--sub); font-weight:600;}
  .switch{display:flex; justify-content:space-between; align-items:center; padding:10px 0;}
  .tag{font-size:12px; color:var(--sub);}
  /* 家长门 */
  .gate-grid{display:grid; grid-template-columns:repeat(3,86px); gap:12px; margin-top:18px;}
  /* 休息遮罩 */
  #rest{
    position:fixed; inset:0; background:rgba(62,58,51,.88); color:#fff;
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index:99;
  }
  #rest.active{display:flex;}
  #rest .big{font-size:60px; margin:14px 0;}
</style>
</head>
<body>

<!-- 首页 -->
<div class="screen active" id="scr-home">
  <div class="topbar">
    <div><h1 style="margin:0;">🔍 视觉小侦探</h1><div class="sub" style="margin:2px 0 0;">每天玩一会儿，眼睛更厉害</div></div>
    <button class="btn small" id="btn-gate">家长</button>
  </div>
  <div class="grid" id="home-grid"></div>
</div>

<!-- 游戏 -->
<div class="screen" id="scr-game">
  <div class="gamebar">
    <div class="title" id="g-title"></div>
    <div class="hint" id="g-hint"></div>
    <button class="btn small" id="g-quit">退出</button>
  </div>
  <div id="game-body"></div>
</div>

<!-- 结算 -->
<div class="screen" id="scr-result">
  <div class="panel">
    <div style="font-size:40px;">🎉</div>
    <div class="verdict" id="r-verdict"></div>
    <div class="stars" id="r-stars"></div>
    <div class="lines" id="r-lines"></div>
    <div class="rowbtns">
      <button class="btn primary" id="r-again">再玩一次</button>
      <button class="btn" id="r-home">回首页</button>
      <button class="btn" id="r-report">看报告</button>
    </div>
  </div>
</div>

<!-- 报告 -->
<div class="screen" id="scr-report">
  <div class="wrap">
    <div class="topbar">
      <h1 style="font-size:26px;">能力报告</h1>
      <button class="btn small" id="rep-back">返回</button>
    </div>
    <div class="card" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;">
      <canvas id="radar" width="300" height="300"></canvas>
      <div id="rep-conclusion" style="flex:1;min-width:260px;font-size:16px;line-height:1.9;"></div>
    </div>
    <div class="card"><div style="font-weight:700;margin-bottom:10px;">各玩法趋势（最近 8 局得分）</div><div id="rep-trends"></div></div>
    <div class="card"><div style="font-weight:700;margin-bottom:10px;">最近记录</div><div id="rep-table"></div></div>
  </div>
</div>

<!-- 家长门 -->
<div class="screen" id="scr-gate">
  <div class="panel">
    <div style="font-size:40px;">🔐</div>
    <div style="font-size:20px;font-weight:700;margin:8px 0 4px;">请大人按顺序点击</div>
    <div style="font-size:30px;font-weight:800;color:var(--accent);">1 → 2 → 3</div>
    <div class="gate-grid" id="gate-grid"></div>
    <div style="margin-top:16px;"><button class="btn small" id="gate-cancel">取消</button></div>
  </div>
</div>

<!-- 设置 -->
<div class="screen" id="scr-settings">
  <div class="wrap" style="max-width:560px;">
    <div class="topbar"><h1 style="font-size:26px;">设置</h1><button class="btn small" id="set-back">返回</button></div>
    <div class="card">
      <div class="switch"><span>音效</span><button class="btn small" id="set-sound"></button></div>
      <div class="switch"><span>下一个提示（舒尔特顶部大数字）</span><button class="btn small" id="set-hint"></button></div>
      <div class="switch"><span>单次护眼提醒</span><span class="tag">累计 20 分钟</span></div>
    </div>
    <div class="card">
      <div class="rowbtns">
        <button class="btn small" id="set-export">导出记录 JSON</button>
        <button class="btn small" id="set-resetlvl">重置难度等级</button>
        <button class="btn small" id="set-clear">清空全部记录</button>
      </div>
    </div>
  </div>
</div>

<!-- 休息 -->
<div id="rest"><div>👀 该休息一下啦</div><div class="big" id="rest-count">20</div><div>看看窗外远处，数 20 个数</div></div>

<script>
'use strict';
/* ================= 基础 ================= */
const $ = s => document.querySelector(s);
function show(id){ document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active', x.id===id)); }
function h(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const DB = {
  key:'detective_v1', data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem(this.key)); }catch(e){ this.data=null; }
    if(!this.data || !this.data.sessions) this.data = { settings:{sound:true,hint:true}, levels:{}, sessions:[] };
    if(!this.data.settings) this.data.settings={sound:true,hint:true};
  },
  save(){ localStorage.setItem(this.key, JSON.stringify(this.data)); },
  lvl(g){ return this.data.levels[g]||1; },
  setLvl(g,v){ this.data.levels[g]=clamp(v,1,10); this.save(); },
  add(s){ this.data.sessions.push(s); this.save(); },
  byGame(g){ return this.data.sessions.filter(s=>s.g===g); }
};

const FX = {
  ctx:null,
  play(f, dur=0.09, delay=0, type='sine', vol=0.12){
    if(!DB.data.settings.sound) return;
    try{
      this.ctx = this.ctx || new (window.AudioContext||window.webkitAudioContext)();
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  },
  ok(){ this.play(660,.08); this.play(880,.1,.08); },
  big(){ this.play(523,.1); this.play(659,.1,.1); this.play(784,.16,.2); },
  bad(){ this.play(220,.12,0,'square',.06); },
  tick(){ this.play(980,.05,0,'triangle',.07); }
};

/* ================= 玩法注册表 =================
   每个玩法：run(container, lvl, onDone)
   onDone({stars, score(0-100), lines:[{k,v}], extra})         */
const GAMES = {
  track:  { name:'追光',       icon:'🐝', color:'#F59E0B', ability:'视觉追踪', desc:'用手电筒照住飞行的小蜜蜂', run:runTrack   },
  schulte:{ name:'星球顺序',   icon:'🪐', color:'#6366F1', ability:'视觉搜索', desc:'按 1 → N 依次点亮星球',   run:runSchulte },
  cancel: { name:'放大镜',     icon:'🔍', color:'#0EA5A0', ability:'视觉分辨', desc:'把所有 ★ 都找出来',       run:runCancel  },
  memory: { name:'闪现记忆',   icon:'🧠', color:'#E86A9A', ability:'视觉记忆', desc:'记住图案刚才的位置',       run:runMemory  },
  hidden: { name:'暗场寻宝',   icon:'🔦', color:'#8A8377', ability:'图形-背景', desc:'v2 敬请期待', locked:true }
};

/* ================= 首页 ================= */
function renderHome(){
  const grid = $('#home-grid'); grid.innerHTML='';
  Object.entries(GAMES).forEach(([key,g])=>{
    const t = h('div','tile'+(g.locked?' locked':''));
    t.appendChild(h('div','lv', g.locked?'v2':'Lv.'+DB.lvl(key)));
    t.appendChild(h('div','ico',g.icon));
    t.appendChild(h('div','nm',g.name));
    t.appendChild(h('div','ab',g.ability+' · '+g.desc));
    if(!g.locked) t.onclick=()=>openGame(key);
    grid.appendChild(t);
  });
}

/* ================= 游戏壳 ================= */
let current=null, playMsTotal=0;
function openGame(key){
  current=key;
  const g=GAMES[key];
  $('#g-title').textContent = g.icon+' '+g.name;
  $('#g-hint').textContent = g.ability+' · Lv.'+DB.lvl(key);
  const body=$('#game-body'); body.innerHTML='';
  show('scr-game');
  const t0=performance.now();
  g.run(body, DB.lvl(key), (result)=>{
    playMsTotal += performance.now()-t0;
    finishGame(key, result);
  });
}
function starsOf(score, th){ return score>=th[1]?3 : score>=th[0]?2 : 1; }
// 结算渲染统一走这里：任何对象都必须先转成可读文本，
// 绝不能直接塞进 textContent（旧版一度把整条结果对象渲染成 [object Object]）。
function safeText(v){
  if(v==null) return '';
  if(typeof v==='object') return JSON.stringify(v);
  return String(v);
}
function finishGame(key, r){
  const stars = clamp(parseInt(r.stars,10)||0, 0, 3);
  const score = Number(r.score)||0;
  const before=DB.lvl(key);
  DB.add({ g:key, lvl:before, score:score, stars:stars, extra:r.extra||{}, t:Date.now() });
  DB.setLvl(key, before + (stars===3?1 : stars===1?-1 : 0));
  FX.big();
  $('#r-verdict').textContent =
    stars>=3 ? '稳稳照住，太准了！' :
    stars===2 ? '不错，再稳一点' : '别急，跟着光点慢慢挪';
  const st=$('#r-stars'); st.textContent='';
  for(let i=1;i<=3;i++) st.appendChild(h('span', i<=stars?'':'off', '★'));
  const ln=$('#r-lines'); ln.textContent='';
  const lines = Array.isArray(r.lines) ? r.lines : [];
  lines.forEach(l=>ln.appendChild(h('div',null, safeText(l&&l.k)+'：'+safeText(l&&l.v))));
  ln.appendChild(h('div',null,'本次得分：'+score+' 分'));
  const up=DB.lvl(key)>before, down=DB.lvl(key)<before;
  ln.appendChild(h('div','tag', up?'难度升级 → Lv.'+DB.lvl(key) : down?'难度降回 Lv.'+DB.lvl(key) : '难度不变 · Lv.'+DB.lvl(key)));
  show('scr-result');
  maybeRest();
}
$('#r-again').onclick=()=>openGame(current);
$('#r-home').onclick=()=>{ renderHome(); show('scr-home'); };
$('#r-report').onclick=()=>renderReport();
$('#g-quit').onclick=()=>{ renderHome(); show('scr-home'); };

/* 护眼：累计 20 分钟弹休息页 */
function maybeRest(){
  if(playMsTotal < 20*60*1000) return;
  playMsTotal=0;
  const rest=$('#rest'); rest.classList.add('active');
  let n=20; $('#rest-count').textContent=n;
  const iv=setInterval(()=>{ n--; $('#rest-count').textContent=n; if(n<=0){ clearInterval(iv); rest.classList.remove('active'); } },1000);
}

/* ================= 玩法 1：追光 ================= */
function runTrack(box, lvl, done){
  const W=880, H=460;
  const cv=h('canvas','stage'); cv.width=W; cv.height=H; cv.style.width='100%';
  const tip=h('div','statline','握住手电筒 🖱️，光圈罩住小蜜蜂就算照到');
  box.appendChild(cv); box.appendChild(tip);
  const ctx=cv.getContext('2d');
  const dur = clamp(42-lvl*2, 22, 40);          // 一圈秒数，越高级越快
  const R   = clamp(84-lvl*4, 44, 84);          // 光圈半径
  const a=2+(lvl%3), b=3+((lvl+2)%3);           // 利萨茹频率
  const ph=Math.random()*6.28;
  let u=0, lit=0, last=performance.now(), wasLit=false, mouse=null, trail=[];
  cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); mouse={x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; });
  cv.addEventListener('mouseleave',()=>mouse=null);
  function pos(t){ return { x:W/2+ (W/2-70)*Math.sin(a*t+ph), y:H/2+(H/2-60)*Math.sin(b*t) }; }
  function frame(now){
    const dt=(now-last)/1000; last=now;
    u += dt/dur;
    if(u>=1){ return end(); }
    const p=pos(u*Math.PI*2);
    const isLit = mouse && Math.hypot(mouse.x-p.x, mouse.y-p.y)<R;
    if(isLit){ lit+=dt; if(!wasLit) FX.tick(); }
    wasLit=isLit;
    trail.push({x:p.x,y:p.y}); if(trail.length>90) trail.shift();
    ctx.clearRect(0,0,W,H);
    // 轨迹
    ctx.strokeStyle='#EFE5D4'; ctx.lineWidth=3; ctx.beginPath();
    for(let i=0;i<=120;i++){ const q=pos(i/120*Math.PI*2); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
    ctx.stroke();
    // 光晕拖尾
    ctx.strokeStyle='rgba(245,158,11,.25)'; ctx.lineWidth=8; ctx.beginPath();
    trail.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke();
    // 手电筒
    if(mouse){ ctx.fillStyle=isLit?'rgba(245,158,11,.30)':'rgba(62,58,51,.10)';
      ctx.beginPath(); ctx.arc(mouse.x,mouse.y,R,0,6.29); ctx.fill(); }
    // 蜜蜂
    ctx.font='40px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🐝', p.x, p.y);
    // 进度条
    ctx.fillStyle='#F0E9DC'; ctx.fillRect(20,H-16,W-40,8);
    ctx.fillStyle='#F59E0B'; ctx.fillRect(20,H-16,(W-40)*u,8);
    requestAnimationFrame(frame);
  }
  function end(){
    const score=Math.round(lit/dur*100);
    const stars=starsOf(score,[50,70]);
    done({stars, score, lines:[{k:'照到时间占比',v:score+'%'}, {k:'光圈半径',v:R+'px'}], extra:{litPct:score}});
  }
  requestAnimationFrame(frame);
}

/* ================= 玩法 2：星球顺序（舒尔特） ================= */
function runSchulte(box, lvl, done){
  const n = lvl<=2?3 : lvl<=5?4 : 5;
  const N=n*n, best=N*1.15; // 理想秒数
  const nums=[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
  const tip=h('div','statline','按 1 → '+N+' 的顺序点亮星球，错了会抖一下');
  const big=h('div','bignum','1');
  const board=h('div','board');
  board.style.gridTemplateColumns='repeat('+n+',74px)';
  box.appendChild(tip); if(DB.data.settings.hint) box.appendChild(big);
  box.appendChild(board);
  let next=1, errors=0; const t0=performance.now();
  for(const v of nums){
    const c=h('button','cell',String(v));
    c.onclick=()=>{
      if(v!==next){ errors++; FX.bad(); c.classList.remove('miss'); void c.offsetWidth; c.classList.add('miss'); return; }
      c.classList.add('done'); c.disabled=true; FX.ok();
      next++; if(next<=N) big.textContent=next;
      if(next>N) end();
    };
    board.appendChild(c);
  }
  function end(){
    const sec=(performance.now()-t0)/1000;
    const score=clamp(Math.round(100*best/sec - errors*6), 10, 100);
    const stars=starsOf(score,[55,80]);
    done({stars, score, lines:[{k:'用时',v:sec.toFixed(1)+' 秒（参考 '+best.toFixed(0)+' 秒）'},{k:'错点',v:errors+' 次'},{k:'网格',v:n+' × '+n}], extra:{sec:+sec.toFixed(1), errors}});
  }
}

/* ================= 玩法 3：放大镜（划消） ================= */
function runCancel(box, lvl, done){
  const shapes=['●','▲','■','◆','★'];
  const hard = lvl>=5;                 // 高级加入相似干扰 ✦
  const rows=5, cols=12, targetCount=8+Math.min(lvl,6);
  const tip=h('div','statline','把所有 ★ 找出来点掉。试试一行一行、从左往右看');
  const stat=h('div','statline','');
  const board=h('div','board');
  board.style.gridTemplateColumns='repeat('+cols+',48px)';
  box.appendChild(tip); box.appendChild(stat); box.appendChild(board);
  const cells=[]; let placed=0;
  const total=rows*cols;
  const idx=[...Array(total)].map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,targetCount);
  const targetSet=new Set(idx);
  let found=0, errors=0; const clicks=[]; const t0=performance.now();
  for(let i=0;i<total;i++){
    const r=Math.floor(i/cols), c=i%cols;
    let ch;
    if(targetSet.has(i)){ ch='★'; }
    else if(hard && Math.random()<0.3){ ch='✦'; }
    else { ch=shapes[Math.floor(Math.random()*4)]; }
    const cell=h('button','cell',ch);
    cell.style.width='48px'; cell.style.height='48px'; cell.style.fontSize='22px';
    cell.onclick=()=>{
      clicks.push({r,c});
      if(targetSet.has(i) && !cell.disabled){ cell.classList.add('done'); cell.disabled=true; found++; FX.ok();
        if(found===targetCount) end(); }
      else if(!targetSet.has(i)){ errors++; FX.bad(); cell.classList.add('miss'); setTimeout(()=>cell.classList.remove('miss'),300); }
      stat.textContent='找到 '+found+' / '+targetCount+' · 误点 '+errors;
    };
    board.appendChild(cell); cells.push(cell);
  }
  stat.textContent='找到 0 / '+targetCount;
  function end(){
    const sec=(performance.now()-t0)/1000;
    // 扫描合规率：相邻两次点击是否大体保持“从左到右、从上到下”
    let ok=0;
    for(let i=1;i<clicks.length;i++){
      const p=clicks[i-1], q=clicks[i];
      if(q.r>p.r || (q.r===p.r && q.c>=p.c)) ok++;
    }
    const scan=clicks.length>1?Math.round(ok/(clicks.length-1)*100):100;
    const acc=Math.round(found/(found+errors)*100);
    const score=clamp(acc - Math.max(0, sec-rows*cols*0.5), 10, 100);
    const stars=starsOf(score,[60,85]);
    done({stars, score, lines:[{k:'用时',v:sec.toFixed(1)+' 秒'},{k:'误点',v:errors+' 次'},{k:'逐行扫描',v:scan+'%'}], extra:{sec:+sec.toFixed(1), errors, scan}});
  }
}

/* ================= 玩法 4：闪现记忆 ================= */
function runMemory(box, lvl, done){
  const n = lvl<5?4:5, N=n*n;
  const k = clamp(3+Math.floor(lvl*0.7), 3, Math.min(8, N-4));
  const showMs = Math.max(1200, 2600-lvl*140);
  const sameEmoji = lvl>=6;
  const pool=['🐞','🍄','⭐','🚀','🦊','🐟','🎈','🍎'];
  const items = sameEmoji ? ['🐞'] : pool.slice(0,k).sort(()=>Math.random()-.5);
  const tip=h('div','statline','先记住图案的位置，消失后把它们点出来');
  const stat=h('div','statline','');
  const board=h('div','board');
  board.style.gridTemplateColumns='repeat('+n+',74px)';
  box.appendChild(tip); box.appendChild(stat); box.appendChild(board);
  const cells=[];
  const pos=[...Array(N)].map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,k);
  const posSet=new Set(pos);
  const emojiOf=new Map();
  pos.forEach((p,i)=>emojiOf.set(p, sameEmoji?'🐞':items[i%items.length]));
  for(let i=0;i<N;i++){
    const c=h('button','cell');
    if(posSet.has(i)) c.textContent=emojiOf.get(i);
    board.appendChild(c); cells.push(c);
  }
  stat.textContent='看好了——';
  let phase='show', found=0, errors=0; const t0=performance.now();
  const showTimer=setTimeout(()=>{
    cells.forEach(c=>{ c.textContent=''; c.classList.add('ghost'); });
    phase='pick'; stat.textContent='它们刚才在哪？';
    cells.forEach((c,i)=>{
      c.classList.remove('ghost');
      c.onclick=()=>{
        if(phase!=='pick'||c.disabled) return;
        if(posSet.has(i)){ c.textContent=emojiOf.get(i); c.classList.add('done'); c.disabled=true; found++; FX.ok();
          if(found===k) end(); }
        else { errors++; FX.bad(); c.classList.add('miss'); setTimeout(()=>c.classList.remove('miss'),300); }
        stat.textContent='找到 '+found+' / '+k+' · 误点 '+errors;
      };
    });
  }, showMs);
  function end(){
    clearTimeout(showTimer);
    const score=clamp(Math.round(100*k/(k+errors*1.5)),10,100);
    const stars=starsOf(score,[60,85]);
    done({stars, score, lines:[{k:'图案数',v:k+' 个'},{k:'闪现',v:(showMs/1000).toFixed(1)+' 秒'},{k:'误点',v:errors+' 次'}], extra:{k, errors}});
  }
}

/* ================= 家长门 ================= */
let gateNext=1, gateFrom='home';
$('#btn-gate').onclick=()=>openGate('home');
function openGate(from){
  gateFrom=from; gateNext=1;
  const grid=$('#gate-grid'); grid.innerHTML='';
  const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
  nums.forEach(v=>{
    const b=h('button','cell',String(v));
    b.onclick=()=>{
      if(v===gateNext){ gateNext++; FX.tick(); b.disabled=true; b.classList.add('done');
        if(gateNext>3){ show(gateFrom==='home'?'scr-settings':'scr-settings'); } }
      else { FX.bad(); gateNext=1;
        grid.querySelectorAll('.cell').forEach(x=>{x.disabled=false;x.classList.remove('done');});
        b.classList.add('miss'); setTimeout(()=>b.classList.remove('miss'),300); }
    };
    grid.appendChild(b);
  });
  show('scr-gate');
}
$('#gate-cancel').onclick=()=>show('scr-home');

/* ================= 报告 ================= */
function abilityScore(g){
  const s=DB.byGame(g).slice(-3);
  if(!s.length) return null;
  return Math.round(s.reduce((a,b)=>a+b.score,0)/s.length);
}
function renderReport(){
  show('scr-report');
  // 雷达图
  const cv=$('#radar'), ctx=cv.getContext('2d');
  const axes=Object.entries(GAMES).filter(([k,g])=>!g.locked);
  const cx=150, cy=150, R=105;
  ctx.clearRect(0,0,300,300);
  for(const ring of [1,.66,.33]){
    ctx.beginPath();
    axes.forEach(([k,g],i)=>{
      const ang=-Math.PI/2 + i*2*Math.PI/axes.length;
      const x=cx+Math.cos(ang)*R*ring, y=cy+Math.sin(ang)*R*ring;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.closePath(); ctx.strokeStyle='#EFE5D4'; ctx.stroke();
  }
  const vals=axes.map(([k])=>abilityScore(k));
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/axes.length;
    const r=v==null?0:R*clamp(v,0,100)/100;
    const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath(); ctx.fillStyle='rgba(245,158,11,.30)'; ctx.fill();
  ctx.strokeStyle='#F59E0B'; ctx.lineWidth=2; ctx.stroke();
  ctx.font='13px sans-serif'; ctx.fillStyle='#3E3A33'; ctx.textAlign='center';
  axes.forEach(([k,g],i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/axes.length;
    ctx.fillText(g.ability, cx+Math.cos(ang)*(R+26), cy+Math.sin(ang)*(R+22));
  });
  // 结论
  const valid=axes.map(([k,g])=>({g, v:abilityScore(k)})).filter(x=>x.v!=null);
  const cEl=$('#rep-conclusion');
  if(!valid.length){ cEl.innerHTML='还没有记录。<br>先去玩几局，这里会自动长出雷达图。'; }
  else{
    const sorted=[...valid].sort((a,b)=>a.v-b.v);
    const weak=sorted[0], strong=sorted[sorted.length-1];
    cEl.innerHTML =
      '目前最强：<b>'+strong.g.ability+'</b>（'+strong.v+' 分）<br>'+
      '当前最弱：<b style="color:var(--bad)">'+weak.g.ability+'</b>（'+weak.v+' 分）<br>'+
      '<span style="color:var(--sub)">建议：本周多玩 2 局「'+weak.g.name+'」，把它的等级拉上来。</span>';
  }
  // 趋势
  const tr=$('#rep-trends'); tr.innerHTML='';
  axes.forEach(([k,g])=>{
    const row=h('div'); row.style.cssText='display:flex;align-items:center;gap:12px;padding:6px 0;';
    row.appendChild(h('span',null,g.icon+' '+g.name)); row.firstChild.style.cssText='width:120px;font-size:14px;';
    const cv2=document.createElement('canvas'); cv2.width=280; cv2.height=36;
    const data=DB.byGame(k).slice(-8).map(s=>s.score);
    const c2=cv2.getContext('2d');
    if(data.length){
      c2.strokeStyle=g.color; c2.lineWidth=2.5; c2.beginPath();
      data.forEach((v,i)=>{ const x=8+i*(264/Math.max(1,data.length-1)), y=32-24*clamp(v,0,100)/100;
        i?c2.lineTo(x,y):c2.moveTo(x,y); });
      c2.stroke();
      c2.fillStyle=g.color;
      data.forEach((v,i)=>{ const x=8+i*(264/Math.max(1,data.length-1)), y=32-24*clamp(v,0,100)/100;
        c2.beginPath(); c2.arc(x,y,3,0,6.29); c2.fill(); });
    } else { c2.fillStyle='#C9C1B4'; c2.font='12px sans-serif'; c2.fillText('暂无数据', 10, 22); }
    row.appendChild(cv2);
    const last=data.length?data[data.length-1]+' 分':'—';
    row.appendChild(h('span','tag', last));
    tr.appendChild(row);
  });
  // 记录表
  const tb=$('#rep-table'); tb.innerHTML='';
  const list=[...DB.data.sessions].slice(-12).reverse();
  if(!list.length){ tb.innerHTML='<span class="tag">暂无记录</span>'; return; }
  const table=h('table');
  table.innerHTML='<tr><th>时间</th><th>玩法</th><th>等级</th><th>得分</th><th>星级</th></tr>';
  list.forEach(s=>{
    const d=new Date(s.t);
    const tr=h('tr');
    tr.innerHTML='<td>'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</td>'+
      '<td>'+GAMES[s.g].icon+' '+GAMES[s.g].name+'</td><td>Lv.'+s.lvl+'</td><td>'+s.score+'</td><td>'+'★'.repeat(s.stars)+'</td>';
    table.appendChild(tr);
  });
  tb.appendChild(table);
}
$('#rep-back').onclick=()=>{ renderHome(); show('scr-home'); };

  $('#set-sound').textContent = DB.data.settings.sound?'已开启':'已关闭';
  $('#set-hint').textContent  = DB.data.settings.hint?'显示':'隐藏';
}
$('#set-back').onclick=()=>{ renderHome(); show('scr-home'); };

$('#set-hint').onclick =()=>{ DB.data.settings.hint=!DB.data.settings.hint; DB.save(); renderSettings(); };
$('#set-resetlvl').onclick=()=>{ DB.data.levels={}; DB.save(); alert('难度等级已全部重置为 Lv.1'); };
$('#set-clear').onclick=()=>{ if(confirm('确定清空全部游玩记录？此操作不可恢复。')){ DB.data.sessions=[]; DB.save(); alert('已清空'); } };
$('#set-export').onclick=()=>{
  const blob=new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='detective-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
};

renderHome();
