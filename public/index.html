<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹幕猜词 · 本地原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0d11; --card:#15181f; --card2:#1b1f28; --line:#272c37;
    --text:#e8eaed; --muted:#8b93a3; --dim:#5c6473;
    --red:#fe2c55; --cyan:#25f4ee;
  }
  body{
    height:100vh; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; padding:20px 24px 18px; gap:14px;
  }
  header{display:flex; align-items:center; gap:14px; flex:none}
  .brand{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:500; letter-spacing:.5px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
  .pill{
    font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--line);
    padding:5px 11px; border-radius:999px;
  }
  .pill b{color:var(--text); font-weight:500}
  .spacer{flex:1}
  button{
    font:inherit; font-size:12px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); padding:6px 13px; border-radius:8px; cursor:pointer;
    transition:.15s;
  }
  button:hover{color:var(--text); border-color:#3a4150; background:var(--card2)}
  button.on{color:#0b0d11; background:var(--cyan); border-color:var(--cyan); font-weight:500}

  main{flex:1; min-height:0; display:grid; grid-template-columns:330px 1fr; gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px}

  .puzzle{display:flex; flex-direction:column}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .tag{
    display:inline-block; align-self:flex-start; font-size:11px; color:var(--cyan);
    border:1px solid rgba(37,244,238,.35); background:rgba(37,244,238,.08);
    padding:3px 9px; border-radius:6px; letter-spacing:.5px;
  }
  /* 分类只是提示，不是题目本身 —— 字号必须明显小于答案槽位，
     否则观众会把「数码」当成答案读，然后疑惑冰箱怎么成了数码 */
  .tag.cat{color:var(--muted); border-color:var(--line); background:#191d25}
  .tag.cat b{color:var(--text); font-weight:500}

  .hints{margin-top:22px; display:flex; flex-direction:column; min-height:0}
  .hints-head{font-size:12px; color:var(--dim); margin-bottom:9px; letter-spacing:.5px}
  .hints-head b{color:var(--cyan); font-weight:500}
  #hintList{list-style:none; display:flex; flex-direction:column; gap:7px}
  #hintList li{
    font-size:13px; color:var(--muted); background:#11141a; border:1px solid var(--line);
    border-radius:7px; padding:8px 11px; animation:in .25s ease;
  }
  #hintList li.lock{color:#3c434f; border-style:dashed; letter-spacing:3px; text-align:center}
  #btnHint{margin-top:11px; align-self:flex-start}
  #btnHint[hidden]{display:none}

  .answer{
    margin-top:20px; margin-bottom:4px; font-size:46px; font-weight:500; letter-spacing:8px;
    color:#39414f; transition:.25s; min-height:58px; line-height:1.15;
  }
  .answer.reveal{color:var(--red); letter-spacing:8px; text-shadow:0 0 24px rgba(254,44,85,.45)}

  .progress{height:4px; border-radius:2px; background:#22262f; overflow:hidden; margin:18px 0 12px}
  .progress i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--red),#ff7a45); transition:width .9s linear}
  .meta{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:auto}
  .meta b{color:var(--muted); font-weight:500}

  .board{display:flex; flex-direction:column; min-height:0}
  .board-head{
    display:flex; align-items:baseline; gap:10px; font-size:13px; color:var(--muted);
    padding-bottom:12px; border-bottom:1px solid var(--line); flex:none;
  }
  .board-head span{font-size:11px; color:var(--dim)}
  ol{list-style:none; overflow-y:auto; flex:1; padding-top:6px}
  ol::-webkit-scrollbar{width:5px}
  ol::-webkit-scrollbar-thumb{background:#2b313d; border-radius:3px}

  .row{
    display:grid; grid-template-columns:26px 96px 1fr 62px 96px; align-items:center; gap:10px;
    padding:9px 6px; border-radius:8px;
  }
  .row.new{animation:in .28s ease}
  .row:hover{background:#1a1e27}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .row.hit{background:rgba(254,44,85,.12)}
  .rank{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:center}
  .row:nth-child(1) .rank{color:var(--red); font-weight:500}
  .word{font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar{height:6px; background:#22262f; border-radius:3px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:3px; transition:width .4s ease}
  .pct{font-size:13px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
  .user{font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right}
  .user .tag{
    display:inline-block; margin-left:5px; padding:0 4px; border-radius:3px;
    font-size:10px; line-height:14px; color:#7d8798; background:#22262f;
    border:1px solid #2b313d; vertical-align:1px;
  }
  .empty{color:var(--dim); font-size:13px; padding:26px 8px; text-align:center; line-height:1.9}

  footer{flex:none; display:flex; align-items:center; gap:14px}
  form{flex:1; display:flex; gap:10px}
  input{
    flex:1; font:inherit; font-size:14px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:12px 16px; outline:none;
    transition:.15s;
  }
  input:focus{border-color:var(--red); background:#191d25}
  input::placeholder{color:var(--dim)}
  form button{
    background:var(--red); border-color:var(--red); color:#fff; font-weight:500;
    padding:0 26px; font-size:14px; border-radius:10px;
  }
  form button:hover{background:#ff4468; border-color:#ff4468; color:#fff}
  .tip{font-size:11px; color:var(--dim); line-height:1.7; text-align:right; flex:none}
  .tip b{color:var(--muted); font-weight:400}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px);
    background:#1f242e; border:1px solid var(--line); border-radius:10px;
    padding:10px 20px; font-size:14px; opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .toast.hit{border-color:var(--red); color:var(--red)}

  @media(max-width:900px){
    main{grid-template-columns:1fr; grid-template-rows:auto 1fr}
    .row{grid-template-columns:24px 88px 1fr 58px}
    .row .user{display:none}
    .answer{font-size:34px; letter-spacing:6px}
  }

  /* OBS 叠层模式：背景透明、隐藏调试用的输入框和按钮、高度自适应内容 */
  body.overlay{background:transparent; height:auto; padding:14px 18px}
  body.overlay .card{background:rgba(10,12,16,.74)}
  body.overlay footer,
  body.overlay header button,
  body.overlay .tip{display:none}
  body.overlay main{flex:none}
  body.overlay ol{flex:none; overflow:visible}

  @media (orientation: portrait){
    body.overlay main{grid-template-columns:1fr; gap:10px}
    body.overlay .answer{font-size:38px; margin-top:14px; margin-bottom:10px; min-height:auto}
    body.overlay .row{padding:12px 6px}
    body.overlay .word{font-size:17px}
    body.overlay .pct{font-size:14px}
    body.overlay .bar{height:7px}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>弹幕猜词</div>
    <div class="pill">第 <b id="round">—</b> 局</div>
    <div class="pill">剩余 <b id="remain">—</b> s</div>
    <div class="pill" id="engine" title="关联度打分引擎">语义引擎 · —</div>
    <div class="spacer"></div>
    <button id="btnBot">模拟弹幕 · 关</button>
    <button id="btnNext">换一题</button>
  </header>

  <main>
    <section class="card puzzle">
      <div class="chips">
        <span class="tag">名词 · <b id="charN">2</b> 字</span>
        <span class="tag cat">分类 · <b id="cat">—</b></span>
      </div>

      <div class="answer" id="answerBox">? ?</div>

      <div class="hints">
        <div class="hints-head">提示 <b id="hintN">1</b> / 3 已解锁</div>
        <ul id="hintList"></ul>
        <button id="btnHint">解锁下一条</button>
      </div>

      <div class="progress"><i id="prog"></i></div>
      <div class="meta">
        <span>已猜 <b id="count">0</b> 次</span>
        <span id="stateText">进行中</span>
      </div>
    </section>

    <section class="card board">
      <div class="board-head">关联度 TOP 12 <span id="hintNote">分数越高越接近答案，100 分即猜中</span></div>
      <ol id="board"><li class="empty">还没有人猜……<br>在下面输入 1–3 个字的词，或点右上角「模拟弹幕」让机器人陪演</li></ol>
    </section>
  </main>

  <footer>
    <form id="form">
      <input id="input" maxlength="8" placeholder="发送 1–3 字猜词…" autocomplete="off" autofocus>
      <button type="submit">发送</button>
    </form>
    <div class="tip">
      Enter 发送 · 同一句话本局只算一次<br>
      本页为<b>本地原型</b>，尚未接入抖音
    </div>
  </footer>

  <div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const boardEl = $('board')
const hintList = $('hintList')
let lastStatus = 'playing'
let lastRound = -1
let autopilot = null // 以服务端为准，避免刷新后按钮和实际状态不一致

// ?overlay=1 → OBS 叠层模式：透明背景，隐藏输入框和调试按钮
if (new URLSearchParams(location.search).get('overlay') === '1') {
  document.body.classList.add('overlay')
}

function colorOf(s) {
  if (s >= 90) return '#fe2c55'
  if (s >= 75) return '#ff7a45'
  if (s >= 60) return '#f0b429'
  if (s >= 40) return '#9aa3b2'
  return '#6d7686'
}

function render(s) {
  $('round').textContent = s.round
  $('remain').textContent = s.remain
  if (s.engine) {
    const e = s.engine
    const short = String(e.model || '').split('/').pop().replace(/:latest$/, '')
    $('engine').textContent = e.enabled ? `语义引擎 · ${short}` : '语义引擎 · 图谱模式'
    $('engine').style.color = e.enabled ? 'var(--green, #3fb950)' : ''
  }
  $('cat').textContent = s.category
  $('count').textContent = s.guessCount

  $('hintN').textContent = s.hintOpen
  // 提示列表只在「内容或解锁进度变化」时重建。
  // 之前每秒一次 broadcast 都整体重写 innerHTML，li 上的 in 动画每秒重播一次，
  // 未解锁那行的「· · ·」就会一直闪。
  const hintSig = s.hintOpen + '|' + s.hints.join('|')
  if (hintList.dataset.sig !== hintSig) {
    hintList.innerHTML = s.hints
      .map((h, i) => (i < s.hintOpen ? `<li>${esc(h)}</li>` : '<li class="lock">· · ·</li>'))
      .join('')
    hintList.dataset.sig = hintSig
  }
  $('btnHint').hidden = s.hintOpen >= s.hints.length
  $('prog').style.width = (s.remain / s.total * 100).toFixed(1) + '%'

  const revealed = s.status === 'revealed'
  const n = s.len || [...(s.answer || '')].length || 2
  $('charN').textContent = n
  $('answerBox').textContent = revealed ? [...s.answer].join(' ') : Array(n).fill('?').join(' ')
  $('answerBox').classList.toggle('reveal', revealed)
  $('stateText').textContent = revealed ? '已揭晓' : '进行中'

  if (s.round !== lastRound) {
    lastRound = s.round
    boardEl.innerHTML = EMPTY_HTML
    boardEl.dataset.sig = ''
  }

  // 模拟弹幕开关以服务端状态为准：刷新页面、换标签页都不会再出现
  // 「机器人还在猜，但按钮显示已关」这种对不上的情况
  if (autopilot !== s.autopilot) {
    autopilot = s.autopilot
    $('btnBot').classList.toggle('on', autopilot)
    $('btnBot').textContent = '模拟弹幕 · ' + (autopilot ? '开' : '关')
  }

  if (!s.board.length) return
  const prev = new Set((boardEl.dataset.words || '').split('|').filter(Boolean))
  const rows = s.board.map((e, i) => {
    const c = colorOf(e.score)
    const isNew = prev.has(e.word) ? '' : ' new'
    return `<li class="row${e.hit ? ' hit' : ''}${isNew}">
      <span class="rank">${i + 1}</span>
      <span class="word" style="${e.hit ? 'color:' + c : ''}">${esc(e.word)}</span>
      <span class="bar"><i style="width:${e.score}%;background:${c}"></i></span>
      <span class="pct" style="color:${c}">${e.score.toFixed(1)}%</span>
      <span class="user">${esc(e.user)}${e.bot ? '<i class="tag">模拟</i>' : ''}</span>
    </li>`
  }).join('')
  boardEl.dataset.words = s.board.map((e) => e.word).join('|')

  // 只在榜单内容变化时重建，避免每秒钟闪一次动画
  const sig = s.board.map((e) => e.word + e.score + e.user).join('|')
  if (boardEl.dataset.sig !== sig) {
    boardEl.innerHTML = rows
    boardEl.dataset.sig = sig
  }

  if (lastStatus !== s.status && s.status === 'revealed') toast('答案是「' + s.answer + '」', false)
  lastStatus = s.status
}

const esc = (t) => String(t).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]))
const EMPTY_HTML = '<li class="empty">还没有人猜……<br>在下面输入 1–3 个字的词，或点右上角「模拟弹幕」让机器人陪演</li>'

let toastTimer
function toast(msg, hit) {
  const el = $('toast')
  el.textContent = msg
  el.classList.toggle('hit', !!hit)
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200)
}

const es = new EventSource('/api/stream')
es.onmessage = (e) => render(JSON.parse(e.data))

$('form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const text = $('input').value.trim()
  if (!text) return
  $('input').value = ''
  const r = await fetch('/api/guess', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: '我', text }),
  })
  const j = await r.json()
  if (!j.ok) return toast(j.reason === 'duplicate' ? '这个词你猜过了' : '本局已结束', false)
  toast(j.hit ? '猜中了！' : `${text} → ${j.score.toFixed(1)}%`, j.hit)
})

$('btnNext').onclick = () => fetch('/api/next', { method: 'POST' })

$('btnHint').onclick = () => fetch('/api/hint', { method: 'POST' })

$('btnBot').onclick = async () => {
  const next = !autopilot
  await fetch('/api/autopilot', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ on: next }),
  })
}
</script>
</body>
</html>
