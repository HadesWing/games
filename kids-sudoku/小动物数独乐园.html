<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>小动物数独乐园 v7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; overflow-y: auto; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #ffe9f2 0%, #fff7e0 55%, #e0f7ff 100%);
    display: flex; flex-direction: column; align-items: center;
    user-select: none; touch-action: manipulation;
  }
  header { text-align: center; margin-top: 10px; }
  h1 {
    font-size: clamp(24px, 5vmin, 38px); color: #ff6f91; letter-spacing: 2px;
    text-shadow: 0 3px 0 #fff, 0 5px 12px rgba(255,111,145,.25);
  }
  h1 .zoo { font-size: .9em; }
  #levelBar { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .lvBtn {
    border: none; border-radius: 999px; padding: 8px 16px;
    font-size: clamp(13px, 2.4vmin, 17px); font-weight: bold; cursor: pointer;
    background: #fff; color: #9aa3b2; box-shadow: 0 3px 8px rgba(0,0,0,.08);
    transition: all .2s;
  }
  .lvBtn.active { background: #ffd166; color: #7a4b00; transform: scale(1.08); box-shadow: 0 4px 12px rgba(255,209,102,.5); }
  #hintText {
    margin-top: 8px; min-height: 1.6em; font-size: clamp(15px, 2.8vmin, 20px);
    color: #5b7a99; font-weight: bold; text-align: center; padding: 0 12px;
  }
  #hintText.warn { color: #ff5470; animation: pop .3s; }
  #hintText.good { color: #2fb379; animation: pop .3s; }

  /* 进度条 + 得分 */
  #statBar {
    display: flex; align-items: center; gap: 8px; margin-top: 6px;
    font-size: clamp(12px, 2.2vmin, 15px); font-weight: bold; color: #6b7a8f;
    padding: 0 12px; flex-wrap: wrap; justify-content: center;
  }
  #barOuter {
    width: clamp(80px, 20vmin, 140px); height: 12px; background: #e8edf5;
    border-radius: 999px; overflow: hidden;
  }
  #barInner { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd166, #ff9f68); border-radius: 999px; transition: width .4s; }
  #scorePill {
    background: #fff; border-radius: 999px; padding: 3px 12px;
    color: #ff6f91; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  #scorePill.drop { animation: pop .35s; }
  #totalText { font-size: clamp(11px, 2vmin, 13px); color: #9aa3b2; font-weight: bold; margin-top: 3px; }
  .minusFloat {
    position: fixed; font-size: clamp(22px, 4vmin, 30px); font-weight: bold; color: #ff5470;
    text-shadow: 0 2px 0 #fff; pointer-events: none; z-index: 60;
    animation: floatUp .9s ease-out forwards;
  }
  @keyframes floatUp { to { transform: translate(-50%, -70px); opacity: 0; } }
  #winScore { font-size: clamp(20px, 4vmin, 28px); font-weight: bold; color: #ff9f68; margin-bottom: 4px; }
  #winProg { font-size: clamp(13px, 2.6vmin, 17px); color: #6b7a8f; font-weight: bold; margin-bottom: 14px; }
  .lvBtn small { display: block; font-size: .78em; color: #b0b8c4; font-weight: normal; margin-top: 1px; }
  .lvBtn.active small { color: #a8792a; }

  /* 线索卡 */
  #clueBox { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 12px 0; max-width: 640px; }
  .clueCard {
    display: flex; align-items: center; gap: 6px; background: #fff;
    border-radius: 14px; padding: 6px 12px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.08); border: 3px solid #e4e8f0;
    font-size: clamp(13px, 2.4vmin, 17px); font-weight: bold; color: #6b7a8f;
    transition: all .2s;
  }
  .clueCard img { width: clamp(26px, 4.5vmin, 36px); height: clamp(26px, 4.5vmin, 36px); }
  .clueCard.ok { border-color: #7cd992; background: #eafff0; }
  .clueCard.ok::after { content: "✓"; color: #2fb379; font-size: 1.2em; margin-left: 2px; }
  .clueCard.bad { border-color: #ff8fa0; background: #fff0f2; animation: shake .4s; }
  .clueCard.bad::after { content: "✗"; color: #ff5470; font-size: 1.2em; margin-left: 2px; }
  .clueCard:active { transform: scale(.95); }

  #boardWrap {
    flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;
    position: relative; min-height: 0;
  }
  #board {
    display: grid; gap: clamp(4px, 1vmin, 10px);
    background: #fff; padding: clamp(8px, 1.6vmin, 16px);
    border-radius: 24px; box-shadow: 0 10px 30px rgba(120, 90, 160, .18);
  }
  .cell {
    border-radius: 16px; background: #f4f6fb; position: relative; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s;
  }
  /* 关键修复：行高不能依赖内容，否则全空棋盘（大侦探）会塌缩成 0 高度整个消失 */
  .cell { aspect-ratio: 1 / 1; }
  .cell:hover { transform: scale(1.04); }
  .cell.fixed { background: #fff3d6; cursor: default; }
  .cell.fixed:hover { transform: none; }
  .cell.selected-target { background: #d8f3ff; box-shadow: inset 0 0 0 3px #7fd8ff; }
  .cell img { width: 78%; height: 78%; pointer-events: none; }
  .cell.shake { animation: shake .35s; background: #ffe0e6; }
  .cell.justPlaced { animation: dropIn .3s cubic-bezier(.2,1.6,.4,1); }
  .cell.hinted { box-shadow: inset 0 0 0 4px #ffd166; }
  @keyframes dropIn { 0% { transform: scale(.2) rotate(-15deg); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-7px);} 40% { transform: translateX(7px);} 60% { transform: translateX(-5px);} 80% { transform: translateX(5px);} }
  @keyframes pop { 0% { transform: scale(.85);} 60% { transform: scale(1.08);} 100% { transform: scale(1);} }

  #tray {
    display: flex; gap: clamp(8px, 1.8vmin, 18px); margin: 10px 0 8px;
    background: #fff; padding: clamp(8px, 1.6vmin, 14px) clamp(12px, 2.5vmin, 24px);
    border-radius: 999px; box-shadow: 0 8px 24px rgba(120, 90, 160, .15);
  }
  .trayItem {
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    padding: 6px; border-radius: 16px; transition: all .15s; position: relative;
  }
  .trayItem img { width: clamp(40px, 8vmin, 62px); height: clamp(40px, 8vmin, 62px); transition: transform .15s; }
  .trayItem span { font-size: clamp(12px, 2.2vmin, 16px); color: #6b7a8f; font-weight: bold; margin-top: 2px; }
  .trayItem.pick { background: #fff0d6; box-shadow: 0 0 0 3px #ffd166; }
  .trayItem.pick img { transform: scale(1.15); }
  .trayItem.empty { opacity: .3; filter: grayscale(.8); }
  .trayItem .badge {
    position: absolute; top: -4px; right: -2px; background: #ff6f91; color: #fff;
    font-size: clamp(10px, 1.8vmin, 13px); min-width: 1.6em; height: 1.6em; line-height: 1.6em;
    border-radius: 999px; text-align: center; padding: 0 3px; font-weight: bold;
  }

  #btnBar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .actBtn {
    border: none; border-radius: 999px; padding: 10px 20px;
    font-size: clamp(14px, 2.6vmin, 18px); font-weight: bold; cursor: pointer;
    background: #fff; color: #5b7a99; box-shadow: 0 4px 10px rgba(0,0,0,.08); transition: transform .15s;
  }
  .actBtn:active { transform: scale(.93); }
  #soundBtn { background: #ffe3ec; color: #c2426a; min-width: 4.5em; }

  /* 胜利庆祝 */
  #celebrate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); backdrop-filter: blur(3px); z-index: 50; flex-direction: column;
  }
  #celebrate.show { display: flex; }
  #celebrate .card {
    background: #fff; border-radius: 28px; padding: 30px 46px; text-align: center;
    box-shadow: 0 20px 60px rgba(120,90,160,.3); animation: dropIn .5s cubic-bezier(.2,1.6,.4,1);
  }
  #celebrate .stars { font-size: clamp(40px, 9vmin, 64px); }
  #celebrate h2 { color: #ff6f91; font-size: clamp(24px, 5vmin, 36px); margin: 8px 0 16px; }
  #celebrate .actBtn { background: #ffd166; color: #7a4b00; }
  .confetti {
    position: fixed; top: -20px; width: 12px; height: 12px; border-radius: 3px;
    animation: fall linear forwards; z-index: 40; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }

  /* 统计 / 图例弹层（复用庆祝弹层结构） */
  #statsPanel, #legend {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); backdrop-filter: blur(3px); z-index: 50; flex-direction: column;
    padding: 12px;
  }
  #statsPanel.show, #legend.show { display: flex; }
  #statsPanel .card, #legend .card {
    background: #fff; border-radius: 28px; padding: 22px 26px; text-align: center;
    box-shadow: 0 20px 60px rgba(120,90,160,.3); animation: dropIn .5s cubic-bezier(.2,1.6,.4,1);
    max-width: min(92vw, 460px); max-height: 86vh; overflow-y: auto;
  }
  #statsPanel h2, #legend h2 { color: #ff6f91; font-size: clamp(20px, 4.4vmin, 30px); margin: 4px 0 12px; }
  #statsSummary { font-size: clamp(13px, 2.6vmin, 16px); color: #6b7a8f; font-weight: bold; margin-bottom: 10px; }
  .statRow {
    display: flex; align-items: center; gap: 8px; margin: 6px 0;
    font-size: clamp(12px, 2.4vmin, 15px); font-weight: bold; color: #6b7a8f;
    text-align: left;
  }
  .statRow .barOuter { flex: 1; width: auto; }
  .statRow .stars100 { color: #ffb020; white-space: nowrap; }
  #statsPanel .actBtn, #legend .actBtn { margin: 10px 4px 0; }
  #resetBtn { background: #ffe3ec; color: #c2426a; }
  #resetBtn.armed { background: #ff5470; color: #fff; animation: pop .3s; }
  .legendSec { font-size: clamp(12px, 2.5vmin, 15px); color: #6b7a8f; margin: 8px 0; text-align: left; }
  .legendGrid { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .legendRow { display: flex; align-items: center; gap: 10px; }
  .legendTxt { font-size: clamp(11px, 2.3vmin, 14px); color: #6b7a8f; text-align: left; }

  /* 线索卡迷你示意图（图形化线索，不识字也能玩） */
  .miniRel { display: flex; align-items: center; gap: 3px; }
  .miniRel.col { flex-direction: column; }
  .miniGrid { display: grid; gap: 2px; }
  .miniTile {
    width: clamp(20px, 3.8vmin, 30px); height: clamp(20px, 3.8vmin, 30px);
    border-radius: 7px; background: #f4f6fb;
    display: flex; align-items: center; justify-content: center; padding: 1px;
    box-sizing: border-box;
  }
  .miniTile img { width: 88%; height: 88%; pointer-events: none; }
  .miniTile.hi { background: #e2f8e9; box-shadow: inset 0 0 0 2px #7cd992; }
  .miniTile.touchR { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .miniTile.touchL { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .miniArrow { font-size: clamp(13px, 2.6vmin, 20px); line-height: 1; }
</style>
</head>
<body>
<header>
  <h1><span class="zoo">🧩</span> 小动物数独乐园 <span class="zoo">🐾</span></h1>
  <div id="levelBar"></div>
  <div id="statBar">
    <span id="statText">本关 0/12</span>
    <div id="barOuter"><div id="barInner"></div></div>
    <span id="percentText">0%</span>
    <span id="scorePill">得分 100</span>
  </div>
  <div id="totalText">总进度 0/96 · v7</div>
  <div id="hintText">选一个小动物，点格子放进去；每行每列都不能重复哦！</div>
  <div id="clueBox"></div>
</header>

<div id="boardWrap"><div id="board"></div></div>

<div id="tray"></div>
<div id="btnBar">
  <button class="actBtn" id="soundBtn">🔊 声音</button>
  <button class="actBtn" id="legendBtn">❓ 玩法</button>
  <button class="actBtn" id="statsBtn">📊 我的</button>
  <button class="actBtn" id="clearBtn">↩️ 拿回去</button>
  <button class="actBtn" id="newBtn">🔄 换一题</button>
</div>

<div id="celebrate">
  <div class="card">
    <div class="stars">🌟🎉🌟</div>
    <h2>你真棒！全部答对啦！</h2>
    <div id="winScore">本题 100 分</div>
    <div id="winProg">本关已完成 1/12</div>
    <button class="actBtn" id="againBtn">下一题 🎈</button>
  </div>
</div>

<!-- 📊 我的：进度统计 -->
<div id="statsPanel">
  <div class="card">
    <h2>📊 我的成绩</h2>
    <div id="statsSummary"></div>
    <div id="statsList"></div>
    <button class="actBtn" id="resetBtn">🗑️ 重置全部进度</button>
    <button class="actBtn" id="statsCloseBtn">返回</button>
  </div>
</div>

<!-- ❓ 玩法图例（给家长讲规则用） -->
<div id="legend">
  <div class="card">
    <h2>❓ 怎么玩</h2>
    <div class="legendSec"><b>基础规则</b>：每行、每列里同一种小动物只能出现一次。选下面的动物，点格子放进去。</div>
    <div class="legendSec"><b>线索卡怎么看</b>（点卡片可以听）：</div>
    <div class="legendGrid">
      <div class="legendRow"><span data-demo="left"></span><span class="legendTxt">顺着箭头走能找到第二只：<br>青蛙在熊的左边</span></div>
      <div class="legendRow"><span data-demo="above"></span><span class="legendTxt">青蛙在熊的上面</span></div>
      <div class="legendRow"><span data-demo="adjacent"></span><span class="legendTxt">两只小动物紧挨着</span></div>
      <div class="legendRow"><span data-demo="diagonal"></span><span class="legendTxt">两只小动物斜着挨着</span></div>
      <div class="legendRow"><span data-demo="corner"></span><span class="legendTxt">这只动物坐在角落里</span></div>
      <div class="legendRow"><span data-demo="top"></span><span class="legendTxt">这只动物坐在最上面一排</span></div>
    </div>
    <div class="legendSec">线索卡变绿 ✓ = 放对了；变红 ✗ = 和线索矛盾，再想一想。</div>
    <button class="actBtn" id="legendCloseBtn">返回</button>
  </div>
</div>

// mode: "fill"=填空数独  "clue"=方位线索推理
// clue 关卡参数：pre=预放几只动物("rand"=随机 1~2 只)；rowcol=是否要求每行每列不重复
// total=该关卡题库总量（每题由固定种子生成，永远同一题）
const LEVELS = [
  { size: 3, blanks: 4,  mode: "fill", label: "入门 3×3",   icon: "🐣", total: 12 },
  { size: 3, mode: "clue", pre: "rand", rowcol: false, label: "小侦探 3×3", icon: "🔍", total: 12 },
  { size: 4, blanks: 7,  mode: "fill", label: "进阶 4×4",   icon: "🐥", total: 16 },

  { size: 5, blanks: 9,  mode: "fill", label: "高手 5×5",   icon: "🦊", total: 24 },
  { size: 4, mode: "clue", pre: 0, rowcol: true, label: "大侦探 4×4", icon: "🕵️", total: 16 },

// ---------- 状态 ----------

let puzzleIndex = 0;   // 当前是本章题库的第几题
let mistakes = 0;      // 本题错误次数
let currentScore = 100; // 本题当前得分
let mode = "fill";
let solution = [];    // fill 模式答案矩阵
let solutionPos = []; // clue 模式答案：pos[a] = {r, c}
let clues = [];       // clue 模式线索列表
let fixed = [];
let board = [];       // 当前放的是什么（-1 空）
let picked = -1;

let soundOn = true;

const $ = (s) => document.querySelector(s);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- 种子随机（保证每道题的题面固定不变）----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
function seedFor(levelIdx, puzzleIdx) {
  return (levelIdx + 1) * 100003 + (puzzleIdx + 1) * 7919;
}

// ---------- 存档：每关每题的完成情况与得分 ----------
const STORE_KEY = "kidsudoku_v1";
let progress = loadProgress();

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") return p;
    }
  } catch (e) {}
  return {}; // { "关卡索引": { "题号": 最高分 } }
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
}
function levelDone(idx) {
  const m = progress[idx] || {};
  return Object.keys(m).length;
}
function totalDone() {
  return LEVELS.reduce((s, _, i) => s + levelDone(i), 0);
}
function totalPuzzles() {
  return LEVELS.reduce((s, L) => s + L.total, 0);
}
function isDone(lv, pIdx) {
  return !!(progress[lv] && progress[lv][pIdx] != null);
}
function recordDone(lv, pIdx, score) {
  if (!progress[lv]) progress[lv] = {};
  const old = progress[lv][pIdx];
  progress[lv][pIdx] = old == null ? score : Math.max(old, score);
  saveProgress();
}
// 选下一题：优先未完成的题
function nextPuzzleIndex(lv, excludeCur) {
  const L = LEVELS[lv];
  const todo = [];
  for (let i = 0; i < L.total; i++) if (!isDone(lv, i)) todo.push(i);
  const pool = todo.length ? todo : [...Array(L.total).keys()];
  const cand = pool.filter(i => i !== excludeCur);
  const use = cand.length ? cand : pool;
  return use[Math.floor(Math.random() * use.length)];
}

// ================= 出题：填空数独 =================
function makeFillPuzzle(size, blanks) {
  let sq = Array.from({ length: size }, (_, i) =>
    Array.from({ length: size }, (_, j) => (i + j) % size));
  const rows = shuffle([...Array(size).keys()]);
  const cols = shuffle([...Array(size).keys()]);
  const map  = shuffle([...Array(size).keys()]);
  sq = rows.map(r => cols.map(c => map[sq[r][c]]));
  const all = shuffle([...Array(size * size).keys()]);
  const holeSet = new Set(all.slice(0, blanks));
  const fixedMap = Array.from({ length: size * size }, (_, i) => !holeSet.has(i));
  return { solution: sq, fixedMap };
}

// ================= 出题：方位线索（唯一解校验）=================
// 一个摆放 = 每只动物占一格，行不重复、列不重复
function allPlacements(size) {
  const perms = (arr) => {
    if (arr.length <= 1) return [arr];
    const out = [];
    arr.forEach((x, i) => perms(arr.filter((_, j) => j !== i)).forEach(p => out.push([x, ...p])));
    return out;
  };
  const rowPerms = perms([...Array(size).keys()]);
  const colPerms = perms([...Array(size).keys()]);
  const list = [];
  for (const R of rowPerms) for (const C of colPerms) {
    const pos = []; // pos[a] = {r, c}
    for (let a = 0; a < size; a++) pos[a] = { r: R[a], c: C[a] };
    list.push(pos);
  }
  return list;
}

// 线索类型（kind=pair 需要 A、B 两只动物；kind=single 只看 A 一只）
// 注意：每只动物独占一行一列，所以"左边/上面"指列/行方向更靠，不需要同一排
function makeClueTypes(size) {
  const last = size - 1;
  return [
    { id: "left",     kind: "pair",   test: (A, B) => A.c < B.c, label: "在…的左边" },
    { id: "right",    kind: "pair",   test: (A, B) => A.c > B.c, label: "在…的右边" },
    { id: "above",    kind: "pair",   test: (A, B) => A.r < B.r, label: "在…的上面" },
    { id: "below",    kind: "pair",   test: (A, B) => A.r > B.r, label: "在…的下面" },
    { id: "adjacent", kind: "pair",   test: (A, B) => Math.abs(A.r - B.r) + Math.abs(A.c - B.c) === 1, label: "和…紧挨着" },
    { id: "diagonal", kind: "pair",   test: (A, B) => Math.abs(A.r - B.r) === 1 && Math.abs(A.c - B.c) === 1, label: "和…斜着挨着" },
    { id: "corner",   kind: "single", test: (A) => (A.r === 0 || A.r === last) && (A.c === 0 || A.c === last), label: "坐在角落里" },
    { id: "top",      kind: "single", test: (A) => A.r === 0,      label: "坐在最上面一排" },
    { id: "bottom",   kind: "single", test: (A) => A.r === last,   label: "坐在最下面一排" },
    { id: "leftcol",  kind: "single", test: (A) => A.c === 0,      label: "坐在最左边一列" },
    { id: "rightcol", kind: "single", test: (A) => A.c === last,   label: "坐在最右边一列" },
  ];
}

function clueSatisfied(clue, pos) {
  return clue.b >= 0
    ? clue.type.test(pos[clue.a], pos[clue.b])
    : clue.type.test(pos[clue.a], null);
}
function clueSpeech(cl) {
  const nA = ANIMALS[cl.a].name, nB = cl.b >= 0 ? ANIMALS[cl.b].name : "";
  switch (cl.type.id) {
    case "left":     return `${nA}在${nB}的左边`;
    case "right":    return `${nA}在${nB}的右边`;
    case "above":    return `${nA}在${nB}的上面`;
    case "below":    return `${nA}在${nB}的下面`;
    case "adjacent": return `${nA}和${nB}紧挨着`;
    case "diagonal": return `${nA}和${nB}斜着挨着`;
    case "corner":   return `${nA}坐在角落里`;
    case "top":      return `${nA}坐在最上面一排`;
    case "bottom":   return `${nA}坐在最下面一排`;
    case "leftcol":  return `${nA}坐在最左边一列`;
    case "rightcol": return `${nA}坐在最右边一列`;
  }
  return cl.type.label;
}

function makeCluePuzzle(size, preSpec, useRowCol) {
  // 极少数随机布局在现有线索词表下无法区分（卡在 2 种摆法），自动换题重试
  let last;
  for (let attempt = 0; attempt < 30; attempt++) {
    last = makeCluePuzzleOnce(size, preSpec, useRowCol);
    if (last.finalCount === 1) return last;
  }
  return last;
}

function makeCluePuzzleOnce(size, preSpec, useRowCol) {
  const types = makeClueTypes(size);
  const boardArr = Array(size * size).fill(-1); // 预放动物的棋盘
  let placements; // 每个元素是 pos 数组 pos[a]={r,c}
  let answer;

  if (useRowCol) {
    // 进阶：全空白，每行每列不重复
    placements = allPlacements(size);
    answer = placements[Math.floor(rnd() * placements.length)];
  } else {
    // 基础：先预放几只动物，剩余的放到任意空格（不要求行列不重复）
    const numPre = preSpec === "rand" ? 1 + Math.floor(rnd() * 2) : preSpec;
    const cells = shuffle([...Array(size * size).keys()]);
    const animalOrder = shuffle([...Array(size).keys()]);
    for (let i = 0; i < numPre; i++) boardArr[cells[i]] = animalOrder[i];
    const rest = animalOrder.slice(numPre);
    const emptyCells = cells.slice(numPre);
    placements = permsK(emptyCells, rest.length).map(p => {
      const pos = [];
      for (let a = 0; a < size; a++) {
        const fi = boardArr.indexOf(a);
        if (fi >= 0) pos[a] = { r: Math.floor(fi / size), c: fi % size };
      }
      rest.forEach((a, k) => pos[a] = { r: Math.floor(p[k] / size), c: p[k] % size });
      return pos;
    });
    answer = placements[Math.floor(rnd() * placements.length)];
  }

  // 候选线索：所有在答案下成立的线索
  const candidates = [];
  for (let a = 0; a < size; a++)
    for (const t of types.filter(t => t.kind === "single" && t.test(answer[a], null)))
      candidates.push({ a, b: -1, type: t });
  for (let a = 0; a < size; a++)
    for (let b = 0; b < size; b++) {
      if (a === b) continue;
      for (const t of types.filter(t => t.kind === "pair" && t.test(answer[a], answer[b])))
        candidates.push({ a, b, type: t });
    }
  shuffle(candidates);

  // 贪心选线索，直到解唯一
  const countSolutions = (cs) =>
    placements.filter(p => cs.every(cl => clueSatisfied(cl, p))).length;

  let chosen = [];
  let cur = countSolutions(chosen);
  let improved = true;
  while (cur > 1 && improved) {
    improved = false;
    for (const cand of candidates) {
      if (chosen.includes(cand)) continue;
      const n = countSolutions([...chosen, cand]);
      if (n < cur) { chosen = [...chosen, cand]; cur = n; improved = true; break; }
    }
  }
  return { answer, clues: chosen, finalCount: cur, fixedBoard: useRowCol ? null : boardArr };
}

// 从 arr 中取 k 个的所有排列
function permsK(arr, k) {
  if (k === 0) return [[]];
  if (arr.length < k) return [];
  const out = [];
  arr.forEach((x, i) => permsK(arr.filter((_, j) => j !== i), k - 1).forEach(p => out.push([x, ...p])));
  return out;
}

// ================= 渲染 =================
function render(pIdx) {
  const L = LEVELS[level];
  // 选择题号（不传则从未完成的题库里挑一题）
  puzzleIndex = (pIdx == null) ? nextPuzzleIndex(level, -1) : pIdx;
  // 按题号播种：同一题永远长一样
  rnd = mulberry32(seedFor(level, puzzleIndex));
  // 本题计分重置
  mistakes = 0;
  currentScore = 100;

  mode = L.mode;
  picked = -1;
  clues = [];
  clueBox.innerHTML = "";
  clueBox.style.display = mode === "clue" ? "flex" : "none";

  if (mode === "fill") {
    const p = makeFillPuzzle(L.size, L.blanks);
    solution = p.solution;
    fixed = p.fixedMap;
    board = Array.from({ length: L.size * L.size }, (_, i) => fixed[i] ? solution[Math.floor(i / L.size)][i % L.size] : -1);
    setHint("选一个小动物，点格子放进去；每行每列都不能重复哦！");
  } else {
    const p = makeCluePuzzle(L.size, L.pre, L.rowcol);
    solutionPos = p.answer;
    clues = p.clues;
    fixed = Array(L.size * L.size).fill(false);
    board = Array(L.size * L.size).fill(-1);
    if (p.fixedBoard) {
      p.fixedBoard.forEach((v, i) => { if (v >= 0) { fixed[i] = true; board[i] = v; } });
      setHint("有几只小动物已经站好啦！读一读线索卡，把剩下的小动物送到位～");
    } else {
      setHint("读一读线索卡，帮小动物们找到自己的位置！点卡片可以听哦～");
    }
    renderClues();
  }

  // 棋盘
  const cellPx = L.size === 3 ? "clamp(72px, 15vmin, 108px)"
               : L.size === 4 ? "clamp(56px, 12vmin, 88px)"
               : "clamp(44px, 9.5vmin, 70px)";
  boardEl.style.gridTemplateColumns = `repeat(${L.size}, ${cellPx})`;
  // 双保险：显式行高，防止空行/全空棋盘塌缩
  boardEl.style.gridAutoRows = cellPx;
  boardEl.innerHTML = "";
  cellEls = [];
  for (let i = 0; i < L.size * L.size; i++) {
    const d = document.createElement("div");
    d.className = "cell" + (fixed[i] ? " fixed" : "");
    if (fixed[i]) d.appendChild(makeAnimalImg(board[i]));
    d.addEventListener("click", () => onCellClick(i));
    boardEl.appendChild(d);
    cellEls.push(d);
  }

  // 托盘
  trayEl.innerHTML = "";
  for (let a = 0; a < L.size; a++) {
    const t = document.createElement("div");
    t.className = "trayItem";
    t.dataset.animal = a;
    const im = document.createElement("img");
    im.src = img(ANIMALS[a].code); im.alt = ANIMALS[a].name;
    const nm = document.createElement("span");
    nm.textContent = ANIMALS[a].name;
    t.appendChild(im); t.appendChild(nm);
    t.addEventListener("click", () => pickAnimal(a));
    trayEl.appendChild(t);
  }
  updateTray();
  updateStats();
}

// 更新进度条 / 得分 / 关卡按钮上的小数字
function updateStats() {
  const L = LEVELS[level];
  const done = levelDone(level);
  const pct = Math.round(done / L.total * 100);
  $("#statText").textContent = `${L.label} 已完成 ${done}/${L.total}`;
  $("#barInner").style.width = pct + "%";
  $("#percentText").textContent = pct + "%";
  $("#scorePill").textContent = `本题 ${currentScore} 分`;
  $("#totalText").textContent = `总进度 ${totalDone()}/${totalPuzzles()} 题 · 已通关 ${Object.keys(LEVELS).filter(i => levelDone(+i) >= LEVELS[i].total).length} 个关卡 · v7`;
  // 关卡按钮小字
  document.querySelectorAll(".lvBtn").forEach((b, i) => {
    const s = b.querySelector("small");
    if (s) s.textContent = `${levelDone(i)}/${LEVELS[i].total}`;
  });
}

// 扣分：每次点错 -15，最低 10 分
function deduct(cellIdx) {
  mistakes++;
  currentScore = Math.max(10, 100 - mistakes * 15);
  const pill = $("#scorePill");
  pill.textContent = `本题 ${currentScore} 分`;
  pill.classList.add("drop");
  setTimeout(() => pill.classList.remove("drop"), 400);
  // 飘一个 -15
  const L = LEVELS[level];
  let fx = window.innerWidth / 2, fy = window.innerHeight / 2;
  if (cellIdx != null && cellEls[cellIdx]) {
    const r = cellEls[cellIdx].getBoundingClientRect();
    fx = r.left + r.width / 2; fy = r.top + r.height / 2;
  }
  const d = document.createElement("div");
  d.className = "minusFloat";
  d.textContent = "-15";
  d.style.left = fx + "px"; d.style.top = fy + "px";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

function makeAnimalImg(a) {
  const im = document.createElement("img");
  im.src = img(ANIMALS[a].code); im.alt = ANIMALS[a].name; im.draggable = false;
  return im;
}

// ---- 线索卡迷你示意图（图形化，不识字也能玩）----
function miniTile(a, hi) {
  const t = document.createElement("div");
  t.className = "miniTile" + (hi ? " hi" : "");
  if (a >= 0) {
    const im = document.createElement("img");
    im.src = img(ANIMALS[a].code);
    im.alt = ANIMALS[a].name;
    t.appendChild(im);
  }
  return t;
}
function miniArrow(ch) {
  const s = document.createElement("span");
  s.className = "miniArrow";
  s.textContent = ch;
  return s;
}
function cluePictogram(cl) {
  const box = document.createElement("div");
  const t = cl.type.id;
  if (t === "left" || t === "right") {
    // 顺着箭头走能找到第二只：青蛙 ➡️ 熊 = 熊在青蛙右边 = 青蛙在熊的左边
    box.className = "miniRel";
    box.appendChild(miniTile(t === "left" ? cl.a : cl.b));
    box.appendChild(miniArrow("➡️"));
    box.appendChild(miniTile(t === "left" ? cl.b : cl.a));
  } else if (t === "above" || t === "below") {
    box.className = "miniRel col";
    box.appendChild(miniTile(t === "above" ? cl.a : cl.b));
    box.appendChild(miniArrow("⬇️"));
    box.appendChild(miniTile(t === "above" ? cl.b : cl.a));
  } else if (t === "adjacent") {
    // 两块贴在一起 = 紧挨着
    box.className = "miniRel";
    box.style.gap = "0";
    const t1 = miniTile(cl.a); t1.classList.add("touchL");
    const t2 = miniTile(cl.b); t2.classList.add("touchR");
    box.appendChild(t1); box.appendChild(t2);
  } else if (t === "diagonal") {
    // 斜角相触 = 斜着挨着
    box.className = "miniGrid";
    box.style.gridTemplateColumns = "repeat(2, auto)";
    box.appendChild(miniTile(cl.a));
    box.appendChild(miniTile(-1));
    box.appendChild(miniTile(-1));
    box.appendChild(miniTile(cl.b));
  } else {
    // 单动物线索：3×3 迷你盘，绿色高亮允许区域
    box.className = "miniGrid";
    box.style.gridTemplateColumns = "repeat(3, auto)";
    const hiCells = { corner: [0, 2, 6, 8], top: [0, 1, 2], bottom: [6, 7, 8], leftcol: [0, 3, 6], rightcol: [2, 5, 8] }[t];
    const at = { corner: 0, top: 1, bottom: 7, leftcol: 3, rightcol: 5 }[t];
    for (let i = 0; i < 9; i++) box.appendChild(miniTile(i === at ? cl.a : -1, hiCells.includes(i)));
  }
  return box;
}

function renderClues() {
  clueBox.innerHTML = "";
  clues.forEach((cl, idx) => {
    const card = document.createElement("div");
    card.className = "clueCard";
    card.dataset.idx = idx;
    card.appendChild(cluePictogram(cl));
    card.addEventListener("click", () => {
      playTone(600, .08, "sine");
      speak(clueSpeech(cl));
    });
    clueBox.appendChild(card);
  });
  updateClueStatus();
}

function updateClueStatus() {
  if (mode !== "clue") return;
  const size = LEVELS[level].size;
  clueBox.querySelectorAll(".clueCard").forEach(card => {
    const cl = clues[+card.dataset.idx];
    const pa = board.indexOf(cl.a);
    const pb = cl.b >= 0 ? board.indexOf(cl.b) : 0;
    if (pa === -1 || pb === -1) { card.classList.remove("ok", "bad"); return; }
    const posA = { r: Math.floor(pa / size), c: pa % size };
    const posB = cl.b >= 0 ? { r: Math.floor(pb / size), c: pb % size } : null;
    const ok = cl.type.test(posA, posB);
    card.classList.toggle("ok", ok);
    card.classList.toggle("bad", !ok);
  });
}

function updateTray() {
  const L = LEVELS[level];
  // 填空模式每种动物要放 size 只；线索模式每只动物只放 1 次
  const need = mode === "clue" ? 1 : L.size;
  const counts = Array(L.size).fill(0);
  board.forEach(v => { if (v >= 0) counts[v]++; });
  trayEl.querySelectorAll(".trayItem").forEach(t => {
    const a = +t.dataset.animal;
    t.classList.toggle("pick", a === picked);
    t.classList.toggle("empty", counts[a] >= need);
    let b = t.querySelector(".badge");
    if (!b) { b = document.createElement("div"); b.className = "badge"; t.appendChild(b); }
    b.textContent = Math.max(0, need - counts[a]);
    b.style.display = counts[a] >= need ? "none" : "block";
  });
}

// ================= 交互 =================
function pickAnimal(a) {
  picked = (picked === a) ? -1 : a;
  updateTray();
  cellEls.forEach(c => c.classList.remove("selected-target"));
  if (picked >= 0) {
    cellEls.forEach((c, i) => { if (!fixed[i] && board[i] === -1) c.classList.add("selected-target"); });
    setHint(`已选好「${ANIMALS[picked].name}」，点一个空格子放进去吧！`);
    speak(`已选好${ANIMALS[picked].name}，点一个空格子放进去吧`);
  }
}

function onCellClick(i) {
  if (fixed[i]) { const m = "这是题目里本来就有的小动物，动不了哦～"; setHint(m, "warn"); speak(m); return; }

  if (board[i] >= 0 && picked === -1) {
    board[i] = -1;
    cellEls[i].innerHTML = "";
    updateTray(); updateClueStatus();
    setHint("拿回去了，换一个试试！");
    playTone(300, .12, "triangle");
    return;
  }

  if (picked === -1) { const m = "先在下面选一个小动物吧！"; setHint(m, "warn"); speak(m); return; }
  if (board[i] >= 0) { const m = "这里已经有一只啦，先点它把它拿回去～"; setHint(m, "warn"); speak(m); return; }

  const L = LEVELS[level];
  const r = Math.floor(i / L.size), c = i % L.size;
  // 填空模式始终要求每行每列不重复；线索模式看关卡配置
  if (mode === "fill" || L.rowcol) {
    for (let k = 0; k < L.size; k++) {
      if (board[r * L.size + k] === picked && k !== c) return reject(i, `这一行已经有「${ANIMALS[picked].name}」啦，换一个试试！`, r, true);
      if (board[k * L.size + c] === picked && k !== r) return reject(i, `这一列已经有「${ANIMALS[picked].name}」啦，换一个试试！`, c, false);
    }
  }

  // 放置成功
  board[i] = picked;
  cellEls[i].innerHTML = "";
  cellEls[i].appendChild(makeAnimalImg(picked));
  cellEls[i].classList.add("justPlaced");
  setTimeout(() => cellEls[i] && cellEls[i].classList.remove("justPlaced"), 320);
  playTone(660, .1, "sine"); setTimeout(() => playTone(880, .12, "sine"), 90);
  updateTray();

  if (mode === "clue") {
    const before = clueBox.querySelectorAll(".clueCard.bad").length;
    updateClueStatus();
    const after = clueBox.querySelectorAll(".clueCard.bad").length;
    if (after > 0) {
      if (after > before) {
        const m = "咦，有个线索变红了，再想一想它该在哪里？";
        setHint(m, "warn"); speak(m);
        deduct(i);
      } else {
        setHint("还有红色的线索哦，加油！");
      }
    } else {
      setHint(`放好啦！${ANIMALS[picked].name}真棒～`, "good");
      speak(`放好啦，${ANIMALS[picked].name}真棒`);
    }
    checkWinClue();
  } else {
    setHint(`放好啦！${ANIMALS[picked].name}真可爱～`);
    checkWinFill();
  }
}

function reject(i, msg, rc, isRow) {
  const L = LEVELS[level];
  cellEls[i].classList.add("shake");
  setTimeout(() => cellEls[i] && cellEls[i].classList.remove("shake"), 400);
  for (let k = 0; k < L.size; k++) {
    const j = isRow ? rc * L.size + k : k * L.size + rc;
    if (board[j] >= 0 && board[j] === picked) {
      cellEls[j].classList.add("shake");
      setTimeout(() => cellEls[j] && cellEls[j].classList.remove("shake"), 400);
    }
  }
  playTone(180, .2, "square");
  setHint(msg, "warn");
  speak(msg.replace(/「|」/g, ""));
  deduct(i);
}

function setHint(msg, cls) {
  hintText.textContent = msg;
  hintText.className = cls || "";
}

function checkWinFill() { if (!board.some(v => v < 0)) win(); }
function checkWinClue() {
  // 只要每只动物都放了位置 + 所有线索全绿即胜利（空格子可以留空）
  const L = LEVELS[level];
  for (let a = 0; a < L.size; a++) if (board.indexOf(a) === -1) return;
  if (clueBox.querySelectorAll(".clueCard.bad").length === 0) win();
}

$("#clearBtn").addEventListener("click", () => {
  board = board.map((v, i) => fixed[i] ? v : -1);
  cellEls.forEach((c, i) => { if (!fixed[i]) c.innerHTML = ""; });
  picked = -1; updateTray(); updateClueStatus();
  setHint("都拿回去了，重新开始！");
  speak("都拿回去了，重新开始");
  playTone(330, .15, "triangle");
});

$("#newBtn").addEventListener("click", () => {
  render(nextPuzzleIndex(level, puzzleIndex));
  playTone(520, .12, "sine");
  const L = LEVELS[level];
  if (levelDone(level) >= L.total) setHint("本关全部通关啦！再来一题巩固一下～", "good");
});
$("#againBtn").addEventListener("click", () => {
  $("#celebrate").classList.remove("show");
  render(nextPuzzleIndex(level, puzzleIndex));
});

// 声音开关
$("#soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("#soundBtn").textContent = soundOn ? "🔊 声音" : "🔇 静音";
  if (!soundOn) { try { speechSynthesis.cancel(); } catch (e) {} }
  else { playTone(660, .12, "sine"); speak("声音打开啦"); }
});

// ================= 📊 我的：进度统计 =================
function buildStats() {
  let stars = 0;
  for (const lv in progress) for (const p in progress[lv]) if (progress[lv][p] === 100) stars++;
  const cleared = LEVELS.filter((_, i) => levelDone(i) >= LEVELS[i].total).length;
  $("#statsSummary").textContent =
    `总进度 ${totalDone()}/${totalPuzzles()} 题 · 满分 ⭐×${stars} · 已通关 ${cleared} 个关卡`;
  const list = $("#statsList");
  list.innerHTML = "";
  LEVELS.forEach((L, i) => {
    const d = levelDone(i);
    let s = 0;
    const m = progress[i] || {};
    for (const p in m) if (m[p] === 100) s++;
    const pct = Math.round(d / L.total * 100);
    const row = document.createElement("div");
    row.className = "statRow";
    row.innerHTML =
      `<span style="min-width:7.5em">${L.icon} ${L.label}</span>` +
      `<div class="barOuter"><div class="barInner" style="width:${pct}%"></div></div>` +
      `<span>${d}/${L.total}</span>` +
      `<span class="stars100">${s ? "⭐×" + s : ""}</span>`;
    list.appendChild(row);
  });
}
let resetArmed = false;
function disarmReset() {
  resetArmed = false;
  const b = $("#resetBtn");
  b.classList.remove("armed");
  b.textContent = "🗑️ 重置全部进度";
}
$("#statsBtn").addEventListener("click", () => {
  buildStats();
  disarmReset();
  $("#statsPanel").classList.add("show");
  playTone(520, .12, "sine");
});
$("#statsCloseBtn").addEventListener("click", () => {
  $("#statsPanel").classList.remove("show");
  playTone(300, .1, "triangle");
});
$("#resetBtn").addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true;
    const b = $("#resetBtn");
    b.classList.add("armed");
    b.textContent = "⚠️ 再点一次，确认清空全部进度！";
    speak("再点一次，确认清空全部进度");
    return;
  }
  progress = {};
  saveProgress();
  disarmReset();
  buildLevelBar();
  buildStats();
  render(nextPuzzleIndex(level, -1));
  setHint("进度已全部重置，重新开始吧！", "good");
  speak("进度已全部重置，重新开始吧");
});

// ================= ❓ 玩法图例 =================
const DEMO_CLUES = {
  left:     { a: 2, b: 1, type: { id: "left" } },
  above:    { a: 2, b: 1, type: { id: "above" } },
  adjacent: { a: 2, b: 1, type: { id: "adjacent" } },
  diagonal: { a: 2, b: 1, type: { id: "diagonal" } },
  corner:   { a: 2, b: -1, type: { id: "corner" } },
  top:      { a: 2, b: -1, type: { id: "top" } },
};
document.querySelectorAll("[data-demo]").forEach(el => {
  el.appendChild(cluePictogram(DEMO_CLUES[el.dataset.demo]));
});
$("#legendBtn").addEventListener("click", () => {
  $("#legend").classList.add("show");
  playTone(520, .12, "sine");
});
$("#legendCloseBtn").addEventListener("click", () => {
  $("#legend").classList.remove("show");
  playTone(300, .1, "triangle");
});

// 关卡按钮（带完成进度小字）
function buildLevelBar() {
  const bar = $("#levelBar");
  bar.innerHTML = "";
  LEVELS.forEach((L, i) => {
    const b = document.createElement("button");
    b.className = "lvBtn" + (i === level ? " active" : "");
    b.dataset.lv = i;
    b.innerHTML = `${L.icon} ${L.label}<small>${levelDone(i)}/${L.total}</small>`;
    b.addEventListener("click", () => {
      document.querySelectorAll(".lvBtn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      level = i;
      render(nextPuzzleIndex(i, -1));
      playTone(520, .12, "sine");
      if (LEVELS[i].mode === "clue") speak("小侦探时间！读一读线索卡，帮小动物们找到位置");
    });
    bar.appendChild(b);
  });
}

// ================= 音频 =================
// 1) WebAudio 合成音效（无音频文件）
let AC;
function playTone(freq, dur, type) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.18, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function playWinSound() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, .28, "sine"), i * 130));
}

// 2) 中文语音朗读（系统自带 TTS，无需下载音频）
function speak(text) {
  if (!soundOn || !text) return;
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.92;
    u.pitch = 1.15;
    const zh = speechSynthesis.getVoices().find(v => /zh|Chinese|中文/i.test(v.lang + " " + v.name));
    if (zh) u.voice = zh;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

// ================= 庆祝 =================
function win() {
  playWinSound();
  recordDone(level, puzzleIndex, currentScore);
  updateStats();
  $("#winScore").textContent = currentScore === 100
    ? `本题 100 分 · 满分！🏅`
    : `本题 ${currentScore} 分`;
  $("#winProg").textContent =
    `本关已完成 ${levelDone(level)}/${LEVELS[level].total} · 总进度 ${totalDone()}/${totalPuzzles()}`
    + (totalDone() >= totalPuzzles() ? " · 🎊 全部关卡通关！" : "");
  speak(currentScore === 100 ? "满分！你真棒！" : `你真棒！本题${currentScore}分`);
  $("#celebrate").classList.add("show");
  const colors = ["#ff6f91", "#ffd166", "#a8e6cf", "#7fd8ff", "#c9a7ff"];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    p.style.animationDelay = Math.random() * .5 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3800);
  }
}

buildLevelBar();
render();
