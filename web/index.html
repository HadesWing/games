<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拼音乐园 · 听音钓鱼和找朋友</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🔤</text></svg>">
<style>
  :root{
    --paper:#fff8ef; --ink:#4a3524; --soft:#8a6a4a; --line:#f0dfc8;
    --orange:#e8563f; --orange-dark:#c33d2b; --blue:#2e86c1; --blue-dark:#1a5f92;
    --green:#1b9c7c; --gold:#f5b941; --card:#fff; --shadow:0 6px 18px rgba(150,100,60,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,#cdeafb 0%,#eaf7ee 48%,#fff4dc 100%);
       color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       min-height:100vh;padding:0 0 28px}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0 14px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand .logo{font-size:38px;line-height:1}
  .brand h1{margin:0;font-size:26px;letter-spacing:1px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--soft)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:10px 18px;border-radius:999px;background:#fff;color:var(--soft);
       font-size:15px;font-weight:700;box-shadow:var(--shadow);transition:.15s}
  .tab:hover{transform:translateY(-2px)}
  .tab.on{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-dark)}
  .tools{display:flex;gap:8px;align-items:center}
  .badge{background:#fff3d6;color:#a06a12;border-radius:999px;padding:9px 14px;
         font-size:14px;font-weight:800;box-shadow:var(--shadow)}
  .mini{background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;
        font-weight:700;box-shadow:var(--shadow);color:var(--soft)}
  .mini:hover{color:var(--orange)}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;
       font-size:14px;color:var(--soft)}
  .hud b{color:var(--ink)}
  .hud .pill{background:#fff;border-radius:999px;padding:7px 14px;box-shadow:var(--shadow);font-weight:700}
  .hud .pill.hi{background:#fff0d4;color:#a06a12}
  .prompt{background:var(--card);border:2px solid var(--line);border-radius:22px;
          padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center}
  .prompt h2{margin:0 0 10px;font-size:22px}
  .prompt .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{background:#fff1e2;border:2px solid #f3d3ad;border-radius:14px;padding:10px 18px;
       font-size:15px;font-weight:700;color:#a35a17;transition:.15s}
  .btn:hover{border-color:var(--orange);transform:translateY(-2px)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;
               box-shadow:0 4px 0 var(--orange-dark)}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;
            box-shadow:0 4px 0 var(--blue-dark)}
  .text-hint{margin-top:12px;font-size:15px;color:var(--soft)}
  .text-hint b{font-size:30px;color:var(--orange);letter-spacing:2px}
  .hidden{display:none !important}
  .pond{position:relative;background:linear-gradient(180deg,#8fd0f2,#3f9fdc);
        border:4px solid #fff;border-radius:26px;padding:22px 18px 26px;
        box-shadow:var(--shadow);overflow:hidden;min-height:290px}
  .pond:before{content:"";position:absolute;inset:0;
        background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 42%);pointer-events:none}
  .pond .bubbles{position:absolute;inset:0;pointer-events:none;font-size:22px;opacity:.55}
  .fish-grid{position:relative;display:grid;gap:14px;
        grid-template-columns:repeat(auto-fit,minmax(112px,1fr));justify-items:center}
  .fish{position:relative;width:112px;height:88px;border-radius:46px 26px 26px 46px;
        background:var(--c);color:#fff;font-size:38px;font-weight:800;
        box-shadow:0 6px 0 rgba(0,0,0,.14),inset 0 3px 8px rgba(255,255,255,.35);
        display:flex;align-items:center;justify-content:center;
        animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d);
        transition:transform .15s}
  .fish:after{content:"";position:absolute;right:-25px;top:12px;
        border-left:28px solid var(--c);border-top:32px solid transparent;
        border-bottom:32px solid transparent;filter:brightness(.88)}
  .fish:hover{transform:translateY(-5px) scale(1.06)}
  .fish .eye{position:absolute;left:16px;top:13px;width:9px;height:9px;border-radius:50%;
        background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
  .fish.caught{animation:caught .7s ease forwards;pointer-events:none}
  .fish.wrong{animation:shake .34s ease}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes caught{0%{transform:scale(1)}35%{transform:scale(1.3) translateY(-14px)}
                    100%{transform:scale(.4) translateY(-120px);opacity:0}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}
                   75%{transform:translateX(12px)}}
  .toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:60;
         background:#fff;border-radius:999px;padding:12px 24px;font-size:17px;font-weight:800;
         box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .2s ease}
  .toast.ok{color:var(--green)} .toast.no{color:var(--orange)}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
  .target{background:var(--card);border:2px solid var(--line);border-radius:22px;
          padding:16px 20px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center}
  .target .tone{font-size:44px;font-weight:800;color:var(--blue);letter-spacing:3px;line-height:1.2}
  .target .word{font-size:18px;color:var(--soft);margin:4px 0 12px}
  .blend{text-align:center;font-size:52px;font-weight:800;color:var(--blue);
         min-height:74px;letter-spacing:2px;margin:6px 0 12px}
  .blend.pop{animation:pop .32s ease}
  @keyframes pop{0%{transform:scale(.75);opacity:.4}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
  .col{background:var(--card);border:2px solid var(--line);border-radius:20px;
       padding:14px;box-shadow:var(--shadow)}
  .col h3{margin:0 0 12px;font-size:15px;color:var(--soft);text-align:center}
  .cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(76px,1fr))}
  .pcard{background:#eaf5ff;border:3px solid #cfe6f8;border-radius:16px;padding:12px 4px;
         font-size:28px;font-weight:800;color:#23618c;transition:.15s;min-height:64px}
  .pcard.yun{background:#fff1e2;border-color:#f6d9b5;color:#a35a17}
  .pcard:hover{transform:translateY(-3px)}
  .pcard.sel{border-color:var(--orange);background:#ffe0d2;color:var(--orange-dark);
             box-shadow:0 0 0 3px rgba(232,86,63,.18)}
  .pcard.wrong{animation:shake .34s ease}
  .plus{align-self:center;font-size:32px;color:var(--soft);font-weight:800}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
  .snd{background:#fff3e0;border:2px solid #f3d9b5;border-radius:14px;padding:10px 6px;
       text-align:center;transition:.15s;user-select:none}
  .snd:hover{border-color:var(--orange);transform:translateY(-2px)}
  .snd.playing{background:#ffe0d2;border-color:var(--orange);transform:scale(1.05)}
  .snd .k{font-size:28px;font-weight:800;color:#b8560f;line-height:1.2}
  .snd .s{font-size:12px;color:#96704c;margin-top:3px;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
  section.group{background:var(--card);border:2px solid var(--line);border-radius:20px;
       padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  section.group h2{margin:0 0 12px;font-size:17px;color:#c96a2a}
  footer{text-align:center;color:#8a6a4a;font-size:12px;line-height:1.8;margin-top:18px}
  footer a{color:var(--green);text-decoration:none}
  #overlay{position:fixed;inset:0;background:rgba(40,25,10,.55);z-index:50;
           display:none;align-items:center;justify-content:center;padding:20px}
  #overlay.show{display:flex}
  .modal{background:#fff;border-radius:26px;padding:28px 30px;max-width:420px;width:100%;
         text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .modal .stars{font-size:56px;color:var(--gold);letter-spacing:4px;line-height:1.2}
  .modal h2{margin:8px 0 6px;font-size:24px}
  .modal p{margin:0 0 20px;color:var(--soft);font-size:15px;line-height:1.7}
  .modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  @media (max-width:640px){
    header{padding:12px 0 10px;gap:10px}
    .brand h1{font-size:21px}.brand .logo{font-size:30px}.brand p{display:none}
    .tab{padding:9px 13px;font-size:14px}
    .prompt h2{font-size:19px}.target .tone{font-size:36px}
    .blend{font-size:40px;min-height:60px}
    .pair{grid-template-columns:1fr;gap:10px}.plus{display:none}
    .pond{padding:18px 12px 22px;min-height:250px}
    .fish-grid{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
    .fish{width:96px;height:78px;font-size:32px}
    .pcard{font-size:24px;min-height:56px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">🔤</span>
      <div><h1>拼音乐园</h1><p>听一听 · 拼一拼 · 玩会拼音</p></div></div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-game="fishing">🎣 拼音钓鱼</button>
      <button class="tab" data-game="friends">🤝 找朋友</button>
      <button class="tab" data-game="listen">🔊 全部读音</button>
    </nav>
    <div class="tools">
      <span class="badge" id="lvBadge">Lv.1</span>
      <button class="mini" id="soundBtn">🔊 声音开</button>
      <button class="mini hidden" id="homeBtn">🏠 游戏小屋</button>
    </div>
  </header>
  <main id="stage"></main>
  <footer>
    75 个读音均为真人录音 · 来自 <a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener">audio-cmn</a>（Chen Wang，CC BY-SA）<br>
    <span id="footNote">点卡片就能听 · 建议开声音、手机横屏或电脑玩</span>
  </footer>
</div>

function shuffle(a){
  var r = a.slice();
  for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function stageLetters(lv){
  var stages = TABLE.stages || [];
  var n = Math.max(1, Math.min(stages.length, Math.ceil(lv/2)));

  for(var i=0;i<n;i++) out = out.concat(stages[i].letters);
  return out;

function similarOf(k){ return (TABLE.similar||{})[k] || []; }
function distractors(target, count, pool, hard){
  var out = [];

    var sim = similarOf(target);
    for(var i=0;i<sim.length;i++){
      var v = sim[i];
      if(pool.indexOf(v)>=0 && v!==target && out.indexOf(v)<0) out.push(v);
    }
  }
  var rest = shuffle(pool.filter(function(v){ return v!==target && out.indexOf(v)<0; }));
  for(var j=0;j<rest.length && out.length<count;j++) out.push(rest[j]);
  return out.slice(0,count);

function makeFishRound(target, lv){
  var pool = stageLetters(lv);
  var n = Math.max(3, Math.min(8, 2+lv));
  var others = distractors(target, n-1, pool.filter(function(x){return x!==target;}), lv>=6);
  var cards = [target];
  for(var i=0;i<others.length && cards.length<n;i++) if(cards.indexOf(others[i])<0) cards.push(others[i]);
  for(var j=0,p=shuffle(pool);j<p.length && cards.length<n;j++) if(cards.indexOf(p[j])<0) cards.push(p[j]);
  return shuffle(cards.slice(0,n));
}

var SHENG_TIERS = [
  ["b","m","d","t","g","h","k"],
  ["j","q","x","p","l","y","w","n"],
  ["zh","ch","sh","f"]
];
function tierSheng(lv){
  var n = Math.max(1, Math.min(3, Math.ceil(lv/3)));
  var out = []; for(var i=0;i<n;i++) out = out.concat(SHENG_TIERS[i]); return out;
}
function available(lv){
  var u = tierSheng(lv);
  return TABLE.syllables.filter(function(e){ return u.indexOf(e.s)>=0; });
}
function allYun(){ return Array.from(new Set(TABLE.syllables.map(function(e){return e.y;}))); }
function makeFriendRound(entry, lv){
  var nS = Math.max(1, Math.min(4, 1+Math.floor((lv-1)/2)));
  var nY = Math.max(2, Math.min(4, 2+Math.floor((lv-1)/2)));
  var hard = lv>=6;
  var sPool = tierSheng(lv).filter(function(x){ return x!==entry.s; });
  var shengs = [entry.s].concat(distractors(entry.s, nS-1, sPool, hard));
  var yuns = [entry.y].concat(distractors(entry.y, nY-1, allYun(), hard));
  return {
    shengs: shuffle(Array.from(new Set(shengs))),
    yuns: shuffle(Array.from(new Set(yuns)))

}

function blankSave(){ return {levels:{}, sessions:[], sound:true}; }
function loadSave(){
  try{
    var d = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    return {levels:d.levels||{}, sessions:d.sessions||[], sound:d.sound!==false};
  }catch(e){ return blankSave(); }
}
var SAVE = (typeof localStorage !== "undefined") ? loadSave() : blankSave();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
function lvl(g){ return Math.max(1, Math.min(10, SAVE.levels[g]||1)); }
function history(g){ return SAVE.sessions.filter(function(s){return s.g===g;}).slice(-8); }
function starsOf(score, hist){
  var avg = hist.length ? hist.reduce(function(a,s){return a+s.score;},0)/hist.length : 0;
  if(score>=90) return 3;
  if(score>=70) return 2;
  if(score>=50 || (hist.length>=2 && score>=avg)) return 1;
  return 0;
}
function finish(g, score){
  var stars = starsOf(score, history(g));
  SAVE.sessions.push({g:g, lvl:lvl(g), score:score, stars:stars, t:Date.now()});
  if(SAVE.sessions.length>200) SAVE.sessions = SAVE.sessions.slice(-200);
  if(stars>=3) SAVE.levels[g] = Math.min(10, lvl(g)+1);
  else if(stars===0 && lvl(g)>1) SAVE.levels[g] = lvl(g)-1;
  persist();
  return stars;
}

  try{ a.play().catch(function(){}); }catch(e){}
  return true;
}
function playSeq(keys, gap, onStep){
  stopSpeech();
  var seqId = SEQ_ID;
  if(!SAVE.sound){ if(onStep) keys.forEach(function(k,i){onStep(k,i);}); return; }
  keys.forEach(function(k,i){
    SEQ_TIMERS.push(setTimeout(function(){
      if(seqId !== SEQ_ID) return;
      if(typeof Audio !== "undefined" && SAVE.sound){

          var a = new Audio(src); CUR_AUDIO = a;
          try{ a.play().catch(function(){}); }catch(e){}
        }

    }, i*gap));
  });
}

      return {k:k, say:sayOf(k)}; })};
  });
  gs.push({name:"两拼音节 · 带调例字", items:(TABLE.syllables||[]).map(function(e){
    return {k:e.syl, say:e.tone + " " + e.word}; })});
  return gs;
}
function renderListen(){
  var html = '<div class="hud"><span class="pill">🔊 共 <b>' + audioCount() +
    '</b> 个读音</span><span class="pill">点一下就听</span>' +
    '<button class="btn blue" data-act="demo">▶ 示范：b → a → ba</button></div>';
  listenGroups().forEach(function(g){
    html += '<section class="group"><h2>' + esc(g.name) + ' · ' + g.items.length + ' 个</h2><div class="grid">';
    g.items.forEach(function(it){
      html += '<div class="snd" data-act="listen" data-k="' + esc(it.k) + '">' +
        '<div class="k">' + esc(it.k) + '</div><div class="s">' + esc(it.say) + '</div></div>';
    });
    html += '</div></section>';
  });
  stage.innerHTML = html;
}

/* ---------- 结算 ---------- */
function showResult(game){
  stopSpeech();
  var total = game==="fishing" ? ROUND_A : ROUND_B;
  var first = game==="fishing" ? F.first : R.first;
  var score = scoreOf(first, total);
  var stars = finish(game, score);
  sfxWin();
  overlay.innerHTML = '<div class="modal"><div class="stars">' +
    "★".repeat(stars) + "☆".repeat(3-stars) + '</div>' +
    '<h2>' + (stars>=2 ? "太棒啦！" : "完成啦！") + '</h2>' +
    '<p>第一次就对：<b>' + first + ' / ' + total + '</b><br>得分 <b>' + score +
    '</b> 分　当前 Lv.' + lvl(game) + '</p><div class="row">' +
    '<button class="btn primary" data-act="again">🔄 再玩一次</button>' +
    '<button class="btn" data-act="menu">🍬 换个玩法</button></div></div>';
  overlay.classList.add("show");
  updateBadge();
}
function closeResult(){ overlay.classList.remove("show"); overlay.innerHTML = ""; }

/* ---------- 事件（委托，兼容触屏） ---------- */
stage.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]"); if(!el) return;
  var act = el.dataset.act, k = el.dataset.k;
  if(act==="replay"){
    if(GAME==="fishing") playKey(F.targets[F.idx]);
    else if(GAME==="friends") playKey(entry().syl);
  }else if(act==="toggleText"){ F.showText = !F.showText; renderFishing(); }
  else if(act==="toggleHint"){ R.hint = !R.hint; renderFriends(); }
  else if(act==="fish"){ onFish(k, el); }
  else if(act==="sheng"){ onSheng(k); }
  else if(act==="yun"){ submit(R.sel, k, el); }
  else if(act==="listen"){
    document.querySelectorAll(".snd.playing").forEach(function(x){x.classList.remove("playing");});
    if(playKey(k)){ el.classList.add("playing"); setTimeout(function(){el.classList.remove("playing");}, 1100); }
  }
  else if(act==="demo"){
    playSeq(["b","a","ba"], GAP, function(){});
  }
});
stage.addEventListener("dragstart", function(ev){
  var el = ev.target.closest("[data-drag='sheng']");
  if(!el) return;
  ev.dataTransfer.setData("text/plain", el.dataset.k);
  ev.dataTransfer.effectAllowed = "move";
});
stage.addEventListener("dragover", function(ev){
  if(ev.target.closest("[data-act='yun']")) ev.preventDefault();
});
stage.addEventListener("drop", function(ev){
  var el = ev.target.closest("[data-act='yun']"); if(!el) return;
  ev.preventDefault();
  var s = ev.dataTransfer.getData("text/plain");
  if(s){ R.sel = s; setBlend(s); submit(s, el.dataset.k, el); }
});
document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-game]"); if(!b) return;
  closeResult(); setTab(b.dataset.game);
});
soundBtn.addEventListener("click", function(){
  SAVE.sound = !SAVE.sound; persist();
  if(!SAVE.sound) stopSpeech();
  soundBtn.textContent = SAVE.sound ? "🔊 声音开" : "🔇 声音关";
});
overlay.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if(!b) return;
  var g = GAME; closeResult();
  if(b.dataset.act==="again") setTab(g);
  else setTab(g==="fishing" ? "friends" : "fishing");
});
if(location.protocol.indexOf("http")===0){
  var hb = document.getElementById("homeBtn");
  hb.classList.remove("hidden");
  hb.addEventListener("click", function(){ location.href = "../"; });
}
soundBtn.textContent = SAVE.sound ? "🔊 声音开" : "🔇 声音关";
setTab("fishing");
</script>
</body>
</html>
